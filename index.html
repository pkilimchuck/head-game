<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Головна гра: психологічні тести без діагнозів</title>
<meta name="description" content="Короткі психологічні тести без діагнозів і душності. Дізнайся, що відбувається в голові, і як із цим жити.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F4F1">
<meta property="og:type" content="website">
<meta property="og:title" content="Головна гра: з тобою все гаразд, це просто мозок грає в гру">
<meta property="og:description" content="Короткі тести без діагнозів і душності. Результат прийде на email.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column (max 1080px), playful wide-display headlines, pastel test cards on a cool paper ground; one big blue accent for actions. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16191F; --muted:#5D6572; --line:#DDE1DB;
  --cc:#7A93FF; --accent:#2F4BFF; --on-accent:#FFFFFF; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#7A93FF; --h-yellow:#FFD84D; --h-pink:#FF8FB1; --h-mint:#5FD3A8;
  --ok:#17795A; --warn:#B4571B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#13161B; --surface:#1D2128; --ink:#F0F2F6; --muted:#A1A8B5; --line:#2B313B;
  --accent:#8EA2FF; --on-accent:#10131C; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#6D86F5; --h-yellow:#E6C23F; --h-pink:#E0709A; --h-mint:#45BE93;
  --ok:#5FD3A8; --warn:#F0A468; color-scheme:dark}}
:root[data-theme="x-off"]{
  --bg:#13161B; --surface:#1D2128; --ink:#F0F2F6; --muted:#A1A8B5; --line:#2B313B;
  --accent:#8EA2FF; --on-accent:#10131C; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#6D86F5; --h-yellow:#E6C23F; --h-pink:#E0709A; --h-mint:#45BE93;
  --ok:#5FD3A8; --warn:#F0A468; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;padding-block:16px 56px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;margin-bottom:18px;margin-inline:-16px;padding-inline:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:transparent;transition:translate .4s cubic-bezier(.2,.9,.2,1),background .3s,box-shadow .3s}
header.scrolled{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
header.hide{translate:0 -130%}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:1.05rem}
.logo i{width:30px;height:30px;display:inline-block;flex:none;background:radial-gradient(circle at 33% 38%,var(--h-pink) 0 30%,transparent 31%),radial-gradient(circle at 67% 38%,var(--h-yellow) 0 30%,transparent 31%),radial-gradient(circle at 50% 70%,var(--h-blue) 0 30%,transparent 31%);animation:bob 3.2s ease-in-out infinite}

.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:48px;align-items:center;padding-block:28px 40px}
.hero h1{font-size:clamp(1.6rem,3.7vw,2.6rem);font-weight:500;line-height:1.18}
.hero h1 mark{background:none;color:var(--accent);padding:0;display:inline}
.hero p.lead{font-size:1.1rem;color:var(--muted);margin-top:22px;max-width:44ch}
.hero .cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:14px 22px;font-weight:600;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.85rem;color:var(--muted)}
.brain{justify-self:center;width:min(100%,220px);aspect-ratio:1}
.brain svg{width:100%;height:100%;overflow:visible}

/* test grid */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{--tint:var(--h-blue);text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--tint) 24%,var(--surface));border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .25s ease-out,box-shadow .2s,translate .9s cubic-bezier(.2,.9,.2,1),rotate .9s cubic-bezier(.2,.9,.2,1);transition-delay:0s,0s,calc(var(--i,0)*70ms),calc(var(--i,0)*70ms);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));position:relative;overflow:hidden}
.card:hover{--ty:-6px;box-shadow:0 22px 40px -24px rgba(10,12,20,.5)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover::after{opacity:1}
.card .blob{width:44px;height:44px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#16191F;transition:transform .3s}
.card:hover .blob{transform:rotate(12deg) scale(1.08)}
.card h3{font-size:1.02rem;line-height:1.25}
.card p{font-size:.92rem;color:var(--muted)}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:600}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.pill.live{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t-yellow{--tint:var(--h-yellow)} .t-pink{--tint:var(--h-pink)} .t-mint{--tint:var(--h-mint)}

.promise{margin-top:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.promise div{border-top:2px solid var(--ink);padding-top:12px}
.promise b{font-family:var(--display);font-size:.95rem;display:block;margin-bottom:6px}
.promise span{color:var(--muted);font-size:.93rem}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}

/* quiz */
.stage{max-width:640px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.9rem;color:var(--muted);font-weight:500}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.qbox{min-height:430px;padding-top:34px;position:relative}
.q{position:relative;z-index:1}
.qnum{position:absolute;right:-4px;top:-6px;font-family:var(--display);font-weight:700;font-size:clamp(5rem,16vw,9rem);line-height:1;color:color-mix(in srgb,var(--ink) 7%,transparent);pointer-events:none;animation:ghost .5s ease-out}
.hint{display:none;margin-top:16px;font-size:.85rem;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
.opt.kp{animation:kp .22s ease-out}
.q{animation:inR .28s ease-out both}
.q.back{animation-name:inL}
.q h2{font-size:clamp(1.25rem,3.6vw,1.7rem);margin-bottom:26px;line-height:1.25}
.likert{display:grid;gap:10px}
.opt{animation:optIn .4s backwards;animation-delay:calc(var(--i,0)*50ms + 120ms);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s,background .12s}
.opt:hover{border-color:var(--accent);transform:translateX(4px)}
.opt:active{transform:scale(.98)}
.opt .n{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);border-bottom-width:3px;display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* gate + result */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);animation:rise .4s ease-out both}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.field{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0 12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted);margin-bottom:16px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{color:var(--warn);font-size:.9rem;margin-bottom:10px}
.stack{display:grid;gap:22px}
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,13vw,5.5rem);line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-bottom:10px}
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--h-mint),var(--h-yellow),var(--h-pink));margin-top:14px}
.meter i{position:absolute;top:-6px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);left:0;transition:left 1.1s cubic-bezier(.2,1.2,.4,1)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:8px}
.prose p+p{margin-top:12px}
.prose ul,.prose ol{padding-left:20px;margin:12px 0 0;display:grid;gap:8px}
.prose h3{font-size:1rem;margin:18px 0 6px}
.dims{display:grid;gap:14px;margin-top:18px}
.dim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:.92rem}
.dim .v{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.dim.top .v{color:var(--ink)}
.dim .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.dim .track i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .9s cubic-bezier(.2,1,.4,1)}
.dim.top .track i{background:var(--h-pink)}
.driver{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.driver h3{font-size:1rem;margin-bottom:6px}
.driver .act{margin-top:8px;font-weight:500}
.box{border:1.5px dashed var(--line);border-radius:18px;padding:18px}
.box h3{font-size:1rem;margin-bottom:8px}
.offer{background:color-mix(in srgb,var(--h-yellow) 30%,var(--surface));border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,32px);display:grid;gap:16px}
.offer h3{font-size:1.25rem}
.offer .days{display:grid;gap:6px;font-size:.93rem;padding:0;margin:0;list-style:none}
.offer .days li{display:flex;gap:10px}
.offer .days b{flex:none;width:52px;color:var(--muted);font-weight:600}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;justify-self:start}
.timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--h-pink);animation:pulse 1.2s infinite}
.price{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.price b{font-family:var(--display);font-size:1.8rem}
.price s{color:var(--muted)}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.92rem;z-index:9;max-width:calc(100% - 32px);animation:rise .25s ease-out both}


/* ---- awwwards layer ---- */
#prog{position:fixed;left:0;top:0;height:4px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;z-index:50}
#cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:9999;opacity:0;scale:1;transition:scale .4s cubic-bezier(.2,.9,.2,1),opacity .2s;will-change:translate,scale}
#cur.on{opacity:1}
#cur.hot{scale:2.8}
#cur.down{scale:.7}
#cur.hot.down{scale:2.2}
#cur.txt{opacity:0}
html.has-cur,html.has-cur *{cursor:none!important}
html.has-cur input[type=email],html.has-cur input[type=text],html.has-cur textarea{cursor:text!important}
.anim-ready [data-rv]:not(.in){translate:0 52px;rotate:var(--rr,0deg)}
[data-rv]{transition:translate .9s cubic-bezier(.2,.9,.2,1),rotate .9s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.14em;margin-block:-.14em}
.w>span{display:inline-block;animation:wordUp .95s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms + 120ms)}
.hero-copy{will-change:translate}
.brain{will-change:translate,rotate}
.cue{margin-top:34px;display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cue i{width:1px;height:34px;background:var(--muted);transform-origin:50% 0;animation:cue 1.8s ease-in-out infinite}
.mq{overflow:hidden;border-block:1px solid var(--line);margin-block:36px 0;display:block}
.mq-row{display:block;overflow:hidden;padding-block:15px}
.mq-row.a{background:none;color:var(--muted);transform:none}
.mq-t{display:flex;align-items:center;width:max-content;white-space:nowrap;font-family:var(--body);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;will-change:transform}
.mq-t span{display:block}
.dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1.8rem;flex:none}
.mani{height:300vh;margin-block:40px 0;position:relative}
.mani-in{position:sticky;top:0;height:100vh;height:100svh;display:grid;align-content:center;gap:28px}
.mani-in::before{content:attr(data-k);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.mbar{width:min(220px,40vw);height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--mp,0))}
.mani-p{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,5.4vw,4.7rem);line-height:1.1;letter-spacing:-.02em;max-width:21ch;text-wrap:balance;scale:var(--ms,1);transform-origin:0 50%}
.mw{display:inline-block;color:color-mix(in srgb,var(--ink) calc(var(--t,0)*100%),var(--line));opacity:calc(.35 + var(--t,0)*.65);filter:blur(calc((1 - var(--t,0))*5px));translate:0 calc((1 - var(--t,0))*.28em);will-change:filter,translate}
@media (prefers-reduced-motion:reduce){.mw{--t:1;filter:none}}
html:not(.anim-ready) .mani{height:auto}html:not(.anim-ready) .mani-in{position:static;height:auto;padding-block:72px}html:not(.anim-ready) .mw{--t:1;filter:none}
.scene{height:300vh;margin-top:72px}
.scene-in{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100svh;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.scene h2{font-size:clamp(1.5rem,3.4vw,2.2rem);margin-bottom:26px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.steps li{display:flex;gap:16px;color:var(--muted);transition:color .3s,translate .4s}
.steps .sn{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;transition:background .3s,color .3s,border-color .3s}
.steps h3{font-size:1.05rem;margin-bottom:4px;color:inherit}
.steps p{font-size:.93rem}
.scene[data-step="0"] .steps li:nth-child(1),.scene[data-step="1"] .steps li:nth-child(2),.scene[data-step="2"] .steps li:nth-child(3){color:var(--ink);translate:8px 0}
.scene[data-step="0"] .steps li:nth-child(1) .sn,.scene[data-step="1"] .steps li:nth-child(2) .sn,.scene[data-step="2"] .steps li:nth-child(3) .sn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rail{height:4px;background:var(--line);border-radius:9px;margin-top:28px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.vis{position:relative;aspect-ratio:1/1;max-height:min(80vh,460px);width:100%;justify-self:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.v{position:absolute;inset:0;padding:clamp(16px,3vw,28px);display:grid;align-content:center;gap:12px;opacity:0;transform:scale(.94) translateY(20px);transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.2,1)}
.scene[data-step="0"] .v1,.scene[data-step="1"] .v2,.scene[data-step="2"] .v3{opacity:1;transform:none}
.vq p{font-family:var(--display);font-weight:500;font-size:clamp(.95rem,2vw,1.15rem);line-height:1.3}
.vc{display:flex;gap:8px;margin-top:18px}
.vc b{flex:1;height:50px;border-radius:12px;border:1.5px solid var(--line);border-bottom-width:4px;display:grid;place-items:center;font-family:var(--display);transition:background .2s,transform .2s,border-color .2s}
.vc b.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);transform:translateY(3px);border-bottom-width:1.5px}
.vk{font-size:.8rem;color:var(--muted)}
.vcap{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vr{display:grid;gap:4px;font-size:.78rem;min-width:0}
.vt{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.vt i{display:block;height:100%;border-radius:9px;background:var(--accent);width:calc(var(--t)*1% * var(--k,0))}
.vr.hi .vt i{background:var(--h-pink)}
.vt3{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:16px;transition:background .3s,border-color .3s;font-weight:500}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative;transition:background .3s,border-color .3s}
.vt3.done{background:color-mix(in srgb,var(--h-mint) 22%,var(--surface));border-color:var(--h-mint)}
.vt3.done .tick{background:var(--h-mint);border-color:var(--h-mint)}
.vt3.done .tick::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #16191F;border-width:0 2.5px 2.5px 0;rotate:45deg}
.final{margin-top:72px;background:var(--ink);color:var(--bg);border-radius:28px;overflow:hidden;padding:clamp(32px,7vw,64px) clamp(22px,5vw,56px);display:grid;gap:24px;justify-items:start}

 bands:[
  {max:39,id:"low",
   ua:{h:"Здорова самокритика",p:["Ти сумніваєшся рівно стільки, щоб не втратити почуття реальності, і не настільки, щоб це псувало життя. Це нормально, і це добре.","Самозванець у тебе не прописаний. Він іноді дзвонить у двері, але ти не відчиняєш."],tr:["Запиши одну річ, яка вийшла в тебе цього тижня. Просто для архіву.","Коли хвалять, скажи «дякую» без виправдань."],bullets:[]},
   en:{h:"Healthy Self-Doubt",p:["You doubt yourself just enough to stay grounded, and not enough to spoil your days. That's normal, and it's good.","The imposter isn't registered at your address. It rings the bell sometimes, but you don't open the door."],tr:["Write down one thing that went well this week. Just for the archive.","When someone praises you, say “thank you” without disclaimers."],bullets:[]}},
  {max:64,id:"mid",

   en:{h:"Your Inner Critic Works Part-Time",p:["The imposter visits but hasn't unpacked yet. It shows up in new situations: a new job, a new role, a big deadline.","The good news: at this stage it's easy to tame. The bad news: feed it perfectionism and it starts sleeping over."],tr:["Write down 3 things you did this week and what exactly you did to make them happen.","Swap “sorry for bothering you” for “thanks for making time.”"],bullets:[]}},
  {max:100,id:"high",
   ua:{h:"Самозванець у тебе на ставці (і працює понаднормово)",p:["Привіт. Спершу найважливіше: з тобою все гаразд. Це не діагноз і не «дефект характеру». Це твій мозок, який вирішив, що найкраща стратегія виживання: постійно перевіряти, чи тебе ще не «викрили».","Що, імовірно, відбувається:"],
     bullets:["<b>Похвала відскакує, як горох від стіни.</b> Ти чуєш «молодець», а всередині: «Ну, це було легко». Успіх завжди зарахований комусь іншому: удачі, команді, фазі місяця.","<b>Помилка прилипає, як жуйка до підошви.</b> Одне невдале слово на мітингу ти можеш програвати в голові до вівторка.","<b>Ти вибачаєшся за існування.</b> «Вибач, що відволікаю», «Вибач, якщо це дурне питання». Іноді хочеться вибачитись навіть перед дверима.","<b>Ти живеш із внутрішнім аудитором,</b> який приходить без запрошення і завжди знаходить «порушення»."],
     after:"Найчастіше цей патерн трапляється у людей, які старанні, відповідальні й мають високі стандарти. Парадокс: ті, хто справді не вміє щось робити, зазвичай цього не помічають. Тож твої сумніви ще не доказ некомпетентності. Радше навпаки.",
     tr:["Запиши 3 речі, які вдалися тобі цього тижня, і поруч дії, що до цього привели (не «пощастило», а факти).","Коли тебе хвалять, відповідай просто: «Дякую». Без «та це дрібниці».","Замість «вибач за турботу» спробуй «дякую, що знайшов час»."]},
   en:{h:"The Imposter Has Your Number (and Is Working Overtime)",p:["Hi. First, the important part: you're okay. This isn't a diagnosis or a character flaw. It's your brain deciding the best survival strategy is to keep checking whether you've been “found out” yet.","What's probably going on:"],
     bullets:["<b>Praise bounces off like a pea off a wall.</b> You hear “great job” and inside: “It was easy anyway.” Success always gets credited to someone else: luck, the team, the phase of the moon.","<b>Mistakes stick like gum on a shoe.</b> One awkward sentence in a meeting can replay in your head until Tuesday.","<b>You apologize for existing.</b> “Sorry to bother you,” “Sorry if this is a dumb question.” Sometimes you could apologize to the door.","<b>You live with an internal auditor</b> who shows up uninvited and always finds “violations.”"],
     after:"This pattern most often shows up in people who are diligent, responsible and hold high standards. The paradox: people who truly can't do something rarely notice. So your doubt isn't proof of incompetence. If anything, the opposite.",
     tr:["Write down 3 things you did this week, and next to each, “what exactly did I do to make it happen” (actions, not “luck”).","When someone praises you, answer just: “Thank you.” No “oh, it was nothing.”","Swap “sorry for bothering you” for “thanks for making time.”"]}}

      if(FX.brain){FX.brain.style.translate="0 "+(y*-.12).toFixed(1)+"px";FX.brain.style.scale=(1+hp*.35).toFixed(3);FX.brain.style.rotate=(hp*70).toFixed(1)+"deg";FX.brain.style.setProperty("--sp",hp.toFixed(3));FX.brain.style.opacity=(1-Math.max(0,hp-.55)*2).toFixed(3)}
    }
    if(!LITE&&FX.f%90===1)FX.mq.forEach(function(r){r.half=r.t.scrollWidth/2});
    var sgn=FX.v<-.5?-1:1,spd=.5+Math.abs(FX.v)*.15,sk=0;
    if(!LITE)FX.mq.forEach(function(r){
      if(!r.half)return;
      r.x+=r.dir*sgn*spd;if(r.x<=-r.half)r.x+=r.half;if(r.x>0)r.x-=r.half;
      r.t.style.transform="translate3d("+r.x.toFixed(1)+"px,0,0) skewX("+sk.toFixed(2)+"deg)";
    });
    if(!LITE&&FX.mani&&FX.words.length){
      var ms=FX.maniS||(FX.maniS=app.querySelector("#maniS")),r1=ms.getBoundingClientRect();
      if(r1.bottom>-50&&r1.top<vh+50){
        var p=clamp(-r1.top/Math.max(1,r1.height-vh),0,1),pw=clamp(p/.42,0,1);
        if(Math.abs(p-FX.lastP)>.001){FX.lastP=p;var n=FX.words.length;FX.words.forEach(function(w,i){w.style.setProperty("--t",clamp(pw*(n+3)-i,0,1).toFixed(2))});FX.mani.style.setProperty("--ms",(.9+.1*clamp(p*3,0,1)).toFixed(3));FX.mbar=FX.mbar||ms.querySelector(".mbar i");FX.mbar.style.setProperty("--mp",p.toFixed(3));ms.querySelector(".mani-in").style.setProperty("--mp",p.toFixed(3))}
        if(!FX.mr)FX.mr=[].slice.call(ms.querySelectorAll(".mtrack"));
        FX.mr.forEach(function(tr,ix){var pan=Math.max(0,tr.scrollWidth-window.innerWidth),q=ix?1-p:p;tr.style.transform="translate3d("+(-pan*q).toFixed(1)+"px,0,0)"})
      }
    }
    var sc=FX.sc;
    if(sc){
      var r2=sc.getBoundingClientRect(),tot=r2.height-vh;
      if(tot>0&&r2.bottom>-60&&r2.top<vh+60){
        var q=clamp(-r2.top/tot,0,1),st=Math.min(2,Math.floor(q*3)),lp=q>=1?1:q*3-st;
        if(sc.dataset.step!==String(st))sc.dataset.step=st;
        sc.style.setProperty("--p",q.toFixed(3));
        sc.style.setProperty("--k",(st<1?0:st===1?lp:1).toFixed(3));
        var on=st===0?Math.min(4,Math.floor(lp*5)):4;
        sc.querySelectorAll(".vc b").forEach(function(b,i){b.classList.toggle("on",i===on)});
        sc.querySelectorAll(".vt3").forEach(function(row,i){row.classList.toggle("done",st===2&&lp>(i+.2)/3.3)});
      }
    }
    FX.px.forEach(function(el){
      var rr=el.parentElement.getBoundingClientRect();
      if(rr.bottom>0&&rr.top<vh){var pg=clamp((vh-rr.top)/(vh+rr.height),0,1);el.style.translate=((pg-.5)*-80).toFixed(1)+"px 0"}
    });
  }
  requestAnimationFrame(loop);
}

function render(){
  chrome();
  FX.home=false;
  if(S.view==="home")home();else if(S.view==="quiz")quiz();else if(S.view==="gate")gate();else result();
  reveals();mags();
}

document.getElementById("home").onclick=function(){S.view="home";render();window.scrollTo(0,0)};
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){
  S.lang=b.dataset.l;try{localStorage.setItem("mg-lang",S.lang)}catch(e){}
  if(S.view==="result")S.pct=pct();
  render();
}});
initFx();
render();
})();
</script>
