k of myself: “I'm a failure” or “I'm good for nothing.”","r":0},{"ua":"Я називаю себе грубими словами, коли щось іде не так.","en":"I call myself harsh names when something goes wrong.","r":0},{"ua":"Один промах може зіпсувати мені ставлення до себе на цілий день.","en":"One slip can spoil my view of myself for the whole day.","r":0},{"ua":"Мені важко пробачити собі навіть дрібну помилку.","en":"I find it hard to forgive myself even a small mistake.","r":0},{"ua":"Я оцінюю себе як особистість за результатами, а не лише за діями.","en":"I judge myself as a person by results, not only by actions.","r":0},{"ua":"Я чую у голові голос, який каже, що я не заслуговую на добре.","en":"I hear a voice in my head saying I don't deserve good things.","r":0}]},{"ua":{"n":"Наглядач","why":"Наглядач підганяє: «мусиш», «треба більше», «не розслабляйся». Він переконаний, що без батога ти нічого не досягнеш.","act":"Заплануй відпочинок як справу, яку не можна скасувати. Спостерігай, що не руйнується.","res":{"h":"Твій головний критик: Наглядач","p":["Твій критик це Наглядач: він ніколи не каже «досить». Ти багато робиш, але рідко відчуваєш, що встигаєш достатньо.","Наглядач вважає, що тиск це мотивація. Але тиск виснажує, а не рухає. Люди, які вміють відпочивати, зазвичай працюють довше й стабільніше."],"tr":["Постав «стоп-час» у кінці дня й дотримуйся його тиждень.","Заміни «я мушу» на «я обираю» у трьох фразах.","Відпочинок без користі: 20 хвилин на день без мети."],"bullets":[]}},"en":{"n":"The Taskmaster","why":"The Taskmaster pushes: “you must,” “do more,” “don't relax.” He is convinced you'll achieve nothing without a whip.","act":"Schedule rest as a task that can't be cancelled. Watch what doesn't fall apart.","res":{"h":"Your main critic: The Taskmaster","p":["Your critic is the Taskmaster: he never says “enough.” You do a lot but rarely feel you've done enough.","The Taskmaster thinks pressure is motivation. But pressure drains, it doesn't drive. People who can rest usually work longer and steadier."],"tr":["Set a “stop time” at the end of the day and keep it for a week.","Replace “I must” with “I choose” in three phrases.","Rest without a use: 20 minutes a day with no goal."],"bullets":[]}},"items":[{"ua":"Я часто кажу собі «мушу» і «треба», а не «хочу».","en":"I often tell myself “I must” and “I have to,” not “I want to.”","r":0},{"ua":"Я не дозволяю собі відпочивати, поки не зроблю всі справи.","en":"I don't let myself rest until all tasks are done.","r":0},{"ua":"Я підганяю себе, коли втомлений(-а).","en":"I push myself when I'm tired.","r":0},{"ua":"Мені здається, що без жорсткості до себе я стану лінивим(-ою).","en":"I feel that without being hard on myself I'd become lazy.","r":0},{"ua":"Навіть у вихідні я відчуваю, що «мав би» щось робити.","en":"Even on weekends I feel I “should” be doing something.","r":0},{"ua":"Я відчуваю провину, коли просто нічого не роблю.","en":"I feel guilty when I'm simply doing nothing.","r":0}]},{"ua":{"n":"Підривник","why":"Підривник шепоче: «ти не впораєшся», «навіщо намагатись». Він забирає віру до того, як ти спробував(-ла).","act":"Перед справою запиши, що в тебе вже виходило в схожому. Підривник забуває про це першим.","res":{"h":"Твій головний критик: Підривник","p":["Твій критик це Підривник: він б'є не після дії, а до неї. Через нього ти рідше пробуєш, а потім сприймаєш це як доказ, що «не вмієш».","Це замкнене коло: менше спроб, менше досвіду, менше віри. Розірвати його допомагають маленькі, але реальні експерименти."],"tr":["Обери одну дрібну спробу цього тижня й зроби її без очікувань.","Веди «чек-лист доказів»: що вже вдавалось.","Не перевіряй свої сили в голові, перевіряй у діях."],"bullets":[]}},"en":{"n":"The Underminer","why":"The Underminer whispers: “you can't handle it,” “why even try.” He takes your confidence before you've tried.","act":"Before a task write what has already worked in something similar. The Underminer forgets that first.","res":{"h":"Your main critic: The Underminer","p":["Your critic is the Underminer: he strikes not after the action but before. Because of him you try less, then take it as proof you “can't.”","It's a closed circle: fewer attempts, less experience, less confidence. Small but real experiments help break it."],"tr":["Pick one small attempt this week and do it with no expectations.","Keep an “evidence list”: what has already worked.","Don't test your strength in your head, test it in action."],"bullets":[]}},"items":[{"ua":"Перед новою справою я думаю, що в мене точно не вийде.","en":"Before something new I think I definitely won't manage.","r":0},{"ua":"Я не пробую, бо наперед знаю, що буде гірше, ніж у інших.","en":"I don't try because I know in advance it will be worse than others'.","r":0},{"ua":"Коли мені щось вдається, я кажу собі, що це випадковість.","en":"When something works I tell myself it was a coincidence.","r":0},{"ua":"Я відмовляюсь від можливостей, бо «не готовий(-а)».","en":"I turn down opportunities because I'm “not ready.”","r":0},{"ua":"Мій внутрішній голос частіше стримує мене, ніж підтримує.","en":"My inner voice more often holds me back than supports me.","r":0},{"ua":"Я рідко вірю, що в мене вистачить сил на щось більше.","en":"I rarely believe I have the strength for something bigger.","r":0}]},{"ua":{"n":"Порівнювач","why":"Порівнювач весь час ставить тебе поруч із іншими, і ти завжди програєш: чужі «готові результати» проти твого «закулісся».","act":"Порівнюй себе лише з собою рік тому. Запиши три зміни, якими пишаєшся.","res":{"h":"Твій головний критик: Порівнювач","p":["Твій критик це Порівнювач: твоя самооцінка залежить від того, хто поруч і що в нього вийшло. Тому навіть добрий результат швидко знецінюється.","Порівняння може мотивувати, але у твоєму випадку воно частіше болить. Допомагає змінити масштаб: порівнювати себе з собою, а не з чужим фасадом."],"tr":["Відпишись від акаунтів, після яких почуваєшся гірше.","Раз на тиждень записуй три власні кроки вперед.","Став собі питання: «Чого я хочу, не порівнюючи?»"],"bullets":[]}},"en":{"n":"The Comparer","why":"The Comparer keeps putting you next to others, and you always lose: their “finished results” against your “behind the scenes.”","act":"Compare yourself only with yourself a year ago. Write three changes you're proud of.","res":{"h":"Your main critic: The Comparer","p":["Your critic is the Comparer: your self-esteem depends on who's nearby and what they achieved. So even a good result quickly loses value.","Comparison can motivate, but in your case it more often hurts. It helps to change the scale: compare yourself with yourself, not with someone else's facade."],"tr":["Unfollow accounts that make you feel worse.","Once a week note three steps forward of your own.","Ask: “What do I want, without comparing?”"],"bullets":[]}},"items":[{"ua":"Я часто порівнюю свої успіхи з успіхами однолітків чи колег.","en":"I often compare my successes with those of peers or colleagues.","r":0},{"ua":"Після соцмереж я почуваюсь гірше щодо себе.","en":"After social media I feel worse about myself.","r":0},{"ua":"Чужі досягнення змушують мене відчувати, що я відстаю.","en":"Others' achievements make me feel I'm falling behind.","r":0},{"ua":"Мені важко радіти власним успіхам, коли хтось досяг більшого.","en":"I find it hard to enjoy my own success when someone achieved more.","r":0},{"ua":"Я міряю своє життя «за графіком»: у цьому віці я мав(-ла) б уже мати…","en":"I measure my life “by schedule”: at this age I should already have…","r":0},{"ua":"Я думаю, що в інших усе виходить легше, ніж у мене.","en":"I think things come easier for others than for me.","r":0}]},{"ua":{"n":"Тривожний","why":"Тривожний критик малює катастрофи: «а раптом», «все піде не так». Він схожий на турботу, але змушує жити в очікуванні поганого.","act":"Запиши найгірший сценарій, а потім найімовірніший і найкращий. Подивись, наскільки різні вони.","res":{"h":"Твій головний критик: Тривожний","p":["Твій критик це Тривожний: він «захищає» тебе від поганого, малюючи його заздалегідь. Через це дрібна помилка здається катастрофою.","Така пильність колись була корисною. Тепер варто навчити її відрізняти справжню загрозу від звичайного ризику."],"tr":["Запитай себе: «Яка ймовірність цього реально?» і запиши відсоток.","Перед сном запиши три «що, якщо піде добре».","Дихання 4-6 коли голос посилюється."],"bullets":[]}},"en":{"n":"The Alarmist","why":"The Alarmist paints disasters: “what if,” “everything will go wrong.” He looks like care but makes you live waiting for the worst.","act":"Write the worst scenario, then the most likely and the best. See how different they are.","res":{"h":"Your main critic: The Alarmist","p":["Your critic is the Alarmist: he “protects” you from the bad by painting it in advance. That's why a small mistake feels like a catastrophe.","This vigilance was once useful. Now it's worth teaching it to tell a real threat from ordinary risk."],"tr":["Ask yourself: “How likely is this really?” and write a percentage.","Before sleep write three “what if it goes well.”","Breathe 4-6 when the voice grows louder."],"bullets":[]}},"items":[{"ua":"Я часто уявляю найгірший сценарій розвитку подій.","en":"I often picture the worst possible outcome.","r":0},{"ua":"Після невеликої помилки я думаю, що це зруйнує всі мої плани.","en":"After a small mistake I think it will wreck all my plans.","r":0},{"ua":"Я прокручую в голові, що може піти не так, навіть коли все добре.","en":"I replay what could go wrong even when everything's fine.","r":0},{"ua":"Мені важко повірити, що все буде добре, поки це не станеться.","en":"I find it hard to believe things will be fine until they happen.","r":0},{"ua":"Внутрішній голос попереджає мене про небезпеки частіше, ніж потрібно.","en":"My inner voice warns me about dangers more often than needed.","r":0},{"ua":"Мої помилки здаються мені значно серйознішими, ніж іншим.","en":"My mistakes seem much more serious to me than to others.","r":0}]}],"who":{"ua":["Внутрішній критик це не діагноз і не ворог, а звична форма самоспілкування. Тест показує його основний голос, щоб ти міг(-ла) відповісти йому по-новому.","Варто звернутись до психотерапевта, якщо критик супроводжується постійною тривогою, пригніченістю, відчуттям безвиході чи думками про шкоду собі. Терапія, що розвиває співчуття до себе (CFT), і когнітивно-поведінкова терапія допомагають. Це не діагноз, а орієнтир."],"en":["The inner critic isn't a diagnosis or an enemy but a habitual form of self-talk. The test shows its main voice so you can answer it in a new way.","Consider a therapist if the critic comes with constant anxiety, low mood, hopelessness or thoughts of harming yourself. Compassion-focused therapy (CFT) and cognitive behavioral therapy help. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Друг у голові: як змінити тон внутрішнього голосу","d":"Готовий PDF-гайд по внутрішньому критику: як розпізнати свій основний голос, чого він насправді хоче і як навчити його говорити як друг. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Звідки береться внутрішній критик і навіщо він потрібен","П'ять голосів: Суддя, Наглядач, Підривник, Порівнювач, Тривожний","Як відповісти кожному: діалог і переформулювання","Практики співчуття до себе без самообману","Коли самодопомоги мало й до кого звертатись"],"bonus":["щоденник «Що сказав критик»","шаблон листа собі від друга"]},"en":{"t":"A Friend in Your Head: Changing the Tone of Your Inner Voice","d":"A ready-made PDF guide to the inner critic: how to recognize your main voice, what it really wants and how to teach it to speak like a friend. No filler or motivational quotes. It lands in your inbox right after payment.","days":["Where the inner critic comes from and what it's for","Five voices: Judge, Taskmaster, Underminer, Comparer, Alarmist","How to answer each one: dialogue and reframing","Self-compassion practices without self-deception","When self-help isn't enough and who to turn to"],"bonus":["“What the critic said” journal","Template for a letter to yourself from a friend"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твої п'ять голосів критика","profileNote":"Найвищий голос це твій головний критик. Інші показують, що ще звучить у тобі."},"en":{"profile":"Your five critic voices","profileNote":"The highest voice is your main critic. The others show what else speaks in you."}}},{"id":"social","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Контроль","why":"Контроль часто маскується під турботу: «я просто переживаю». Ознака проблеми, коли твоя свобода дедалі звужується.","act":"Запиши конкретні ситуації, де тебе контролювали. Побачити їх списком означає побачити закономірність."},"en":{"n":"Control","why":"Control often hides as care: “I'm just worried.” It's a sign of trouble when your freedom keeps narrowing.","act":"Write down specific situations where you were controlled. Seeing them as a list means seeing the pattern."},"items":[{"ua":"Ця людина хоче знати, де я, з ким і що роблю, щохвилини.","en":"This person wants to know where I am, with whom and what I'm doing, every minute.","r":0},{"ua":"Вона перевіряє мій телефон, повідомлення чи стежить за мною в соцмережах.","en":"They check my phone, messages or watch me on social media.","r":0},{"ua":"Вона вирішує, з ким мені спілкуватись і що носити.","en":"They decide who I may talk to and what I wear.","r":0},{"ua":"Мені доводиться пояснювати кожен свій крок, щоб уникнути сварки.","en":"I have to explain every step of mine to avoid a fight.","r":0},{"ua":"Ця людина поважає моє особисте життя й мої рішення.","en":"This person respects my private life and my decisions.","r":1}]},{"ua":{"n":"Неповага й приниження","why":"Принизливі жарти, глузування й зневага це не «характер». Це спосіб поступово знизити твою самооцінку.","act":"Звернись до довіреної людини й перескажи останню сварку. Подивись, як на це реагують ззовні."},"en":{"n":"Disrespect and put-downs","why":"Humiliating jokes, mockery and contempt aren't “just personality.” They're a way to gradually lower your self-esteem.","act":"Turn to a trusted person and retell the last argument. See how it looks from outside."},"items":[{"ua":"Ця людина висміює мене при інших чи в приватній розмові.","en":"This person mocks me in front of others or in private.","r":0},{"ua":"Після розмов із нею я почуваюсь меншим(-ою) чи дурнішим(-ою).","en":"After talking with them I feel smaller or dumber.","r":0},{"ua":"Вона применшує мої досягнення чи почуття.","en":"They belittle my achievements or feelings.","r":0},{"ua":"Вона називає мене образливими словами під час конфліктів.","en":"They call me insulting names during conflicts.","r":0},{"ua":"Ця людина щиро цінує мене й говорить про мене з повагою.","en":"This person truly values me and speaks of me with respect.","r":1}]},{"ua":{"n":"Ревнощі й ізоляція","why":"Ревнощі можуть виглядати як любов, але коли коло спілкування тане, а світ звужується до однієї людини, це тривожний знак.","act":"Відновлюй зв'язки: напиши одному другу чи близькому цього тижня. Ізоляція це головний ризик."},"en":{"n":"Jealousy and isolation","why":"Jealousy can look like love, but when your circle shrinks and your world narrows to one person, it's a warning sign.","act":"Rebuild connections: write to one friend or relative this week. Isolation is the main risk."},"items":[{"ua":"Ця людина ревнує мене до друзів, колег чи сім'ї.","en":"This person is jealous of my friends, colleagues or family.","r":0},{"ua":"Через неї я рідше бачусь із друзями чи родиною.","en":"Because of them I see friends or family less.","r":0},{"ua":"Мене звинувачують у зраді чи флірті без причин.","en":"I'm accused of cheating or flirting without reason.","r":0},{"ua":"Мені доводиться приховувати спілкування з людьми, щоб уникнути сварки.","en":"I have to hide contact with people to avoid an argument.","r":0},{"ua":"Ця людина радіє моїм друзям і моєму життю поза стосунками.","en":"This person is glad about my friends and my life outside the relationship.","r":1}]},{"ua":{"n":"Нестабільність і гарячий-холодний","why":"Різкі переходи від нестримної ніжності до холоду створюють залежність, схожу на азартну. Цей контраст не те саме, що глибока близькість.","act":"Веди нотатки настрою: коли тобі добре і коли тривожно поруч з цією людиною. Закономірність видно за два тижні."},"en":{"n":"Instability and hot-cold","why":"Sharp swings from overwhelming tenderness to coldness create an addiction similar to gambling. That contrast isn't the same as deep closeness.","act":"Keep mood notes: when you feel good and when anxious around this person. A pattern shows in two weeks."},"items":[{"ua":"Ця людина то дуже ніжна, то раптом холодна без видимої причини.","en":"This person is very tender, then suddenly cold with no visible reason.","r":0},{"ua":"Вона може зникнути на дні й потім поводитись, ніби нічого не сталось.","en":"They can vanish for days and then act as if nothing happened.","r":0},{"ua":"Я весь час намагаюсь вгадати її настрій, щоб не спровокувати конфлікт.","en":"I constantly try to guess their mood so as not to provoke conflict.","r":0},{"ua":"Після сварок вона дуже любляча, обіцяє змінитись, але змін немає.","en":"After fights they're very loving and promise to change, but nothing changes.","r":0},{"ua":"Її ставлення до мене стабільне й передбачуване.","en":"Their attitude toward me is stable and predictable.","r":1}]},{"ua":{"n":"Порушення меж","why":"Межі це не капризи. Якщо твоє «ні» не приймається чи повторно перевіряється, це серйозний тривожний сигнал.","act":"Чітко й спокійно скажи одну межу й подивись на реакцію. Здорова людина її прийме, навіть якщо засмутиться."},"en":{"n":"Boundary violations","why":"Boundaries aren't whims. If your “no” isn't accepted or gets tested again and again, it's a serious warning signal.","act":"State one boundary clearly and calmly and watch the reaction. A healthy person accepts it even if upset."},"items":[{"ua":"Моє «ні» ця людина ігнорує, тисне або ображається.","en":"This person ignores my “no,” pressures me or sulks.","r":0},{"ua":"Мене примушують до речей, на які я не хочу погоджуватись (гроші, інтимність, плани).","en":"I'm pushed into things I don't want to agree to (money, intimacy, plans).","r":0},{"ua":"Вона бере мої речі, гроші чи час без дозволу.","en":"They take my things, money or time without permission.","r":0},{"ua":"Я почуваюсь винним(-ою), коли відстоюю свої межі.","en":"I feel guilty when I defend my boundaries.","r":0},{"ua":"Ця людина приймає моє «ні» без тиску.","en":"This person accepts my “no” without pressure.","r":1}]},{"ua":{"n":"Перекладання відповідальності","why":"Якщо винен(-на) завжди ти, а інша людина ніколи нічого не визнає, стосунки стають асиметричними. Іноді тебе навіть змушують сумніватись у власній пам'яті.","act":"Записуй факти подій зразу після конфлікту. Це допоможе не втрачати довіру до власного сприйняття."},"en":{"n":"Shifting blame","why":"If it's always you at fault and the other person never admits anything, the relationship becomes asymmetric. Sometimes you're even made to doubt your own memory.","act":"Write down the facts of events right after a conflict. It helps you keep trust in your own perception."},"items":[{"ua":"Ця людина ніколи не визнає своєї провини, навіть коли очевидно винна.","en":"This person never admits fault even when clearly in the wrong.","r":0},{"ua":"Мене роблять винним(-ою) у її поведінці: «ти мене довів(-ла)».","en":"I'm blamed for their behavior: “you drove me to it.”","r":0},{"ua":"Вона заперечує те, що сказала чи зробила, і я починаю сумніватись у своїй пам'яті.","en":"They deny what they said or did and I start doubting my memory.","r":0},{"ua":"Мені здається, що я завжди маю вибачатись першим(-ою).","en":"I feel I always have to apologize first.","r":0},{"ua":"Ця людина вміє щиро вибачитись і змінити поведінку.","en":"This person can sincerely apologize and change their behavior.","r":1}]}],"who":{"ua":["Відповідай про одну конкретну людину: партнера, партнерку чи того, з ким ти на початку стосунків. Тест оцінює поведінку, а не людину цілком, і не може бачити весь контекст.","Це не діагноз і не вирок. Якщо в стосунках є страх, загрози чи насильство, не чекай: звернись до місцевої екстреної служби чи лінії підтримки. Також корисно поговорити з психологом, якщо ти постійно почуваєшся напруженим(-ою) поруч із партнером."],"en":["Answer about one specific person: a partner, or someone you're at the start of a relationship with. The test rates behavior, not the whole person, and can't see the full context.","This isn't a diagnosis or a verdict. If there is fear, threats or violence in the relationship, don't wait: contact local emergency services or a support line. It also helps to talk to a psychologist if you constantly feel tense next to your partner."]},"guide":{"ua":{"t":"Прапорці в стосунках: як розпізнати сигнал і що з ним робити","d":"Готовий PDF-гайд про червоні прапорці в стосунках: які ознаки справді тривожні, чим вони відрізняються від звичайних конфліктів і як діяти крок за кроком. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Прапорці й конфлікти: де межа","Шість зон: контроль, неповага, ізоляція, нестабільність, межі, відповідальність","Розмова про межі: скрипти й реакції, на які варто звертати увагу","План безпеки й опора на близьких","Коли звертатись по допомогу й до кого"],"bonus":["чекліст «Мої межі»","план безпеки на одну сторінку"]},"en":{"t":"Relationship Flags: How to Spot the Signal and What to Do About It","d":"A ready-made PDF guide to relationship red flags: which signs are truly alarming, how they differ from ordinary conflicts and how to act step by step. No filler or motivational quotes. It lands in your inbox ],"bullets":[]},"en":{"h":"Red Flags","p":["Your answers show many warning signals at once: control, disrespect, pressure on boundaries or isolation. It doesn't necessarily mean danger, but a relationship in which you constantly feel tense and smaller is not the norm.","You don't have to endure it in silence. Talk to someone you trust or a psychologist: an outside view helps a lot."],"tr":["Talk to a close person or a psychologist about what's happening.","Take care of safety: keep important documents, contacts and money somewhere you can reach.","If there are threats, violence or fear for yourself, contact local emergency services or a support line in your country."],"bullets":[]}}]}];

<h3>Навіщо</h3><p>Щоб надіслати тобі результат і поради, а також іноді запропонувати гайд за темою тесту. Підстава: твоя згода, яку можна відкликати будь-коли.</p>

<h3>Скільки зберігаємо</h3><p>Email зберігається, доки ти не відпишешся. Дані про платежі зберігаються стільки, скільки вимагає закон.</p>
<h3>Твої права</h3><p>Ти можеш попросити доступ до даних, їх виправлення чи видалення, а також відписатись одним кліком у будь-якому листі. Пиши на {contact}. Ти також можеш поскаржитись у орган із захисту даних своєї країни.</p>
<h3>Вік</h3><p>Сайт призначений для людей від 16 років.</p>`},

<h3>Що це за сайт</h3><p>«Головна гра» пропонує безкоштовні тести для самопізнання та платні PDF-гайди. Тести не є медичним чи психологічним діагнозом і не замінюють консультацію спеціаліста. Якщо тобі важко, звернись до психолога чи лікаря.</p>
<h3>Гайди</h3><p>Гайд це готовий PDF-файл, він не персоналізований. Після оплати файл надсилається на email, вказаний при купівлі. Ціна показана на сторінці купівлі, податки (ПДВ) враховує платіжна система.</p>
<h3>Оплата</h3><p>Оплату обробляє Lemon Squeezy як продавець за записом (merchant of record). Договір купівлі укладається з ними, чек і платіжні умови надсилають вони.</p>

function dimScores(){
