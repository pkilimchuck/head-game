<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Головна гра: психологічні тести без діагнозів</title>
<meta name="description" content="Короткі психологічні тести без діагнозів і душності. Дізнайся, що відбувається в голові, і як із цим жити.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F4F1">
<meta property="og:type" content="website">
<meta property="og:title" content="Головна гра: з тобою все гаразд, це просто мозок грає в гру">
<meta property="og:description" content="Короткі тести без діагнозів і душності. Результат одразу на екрані.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column (max 1080px), playful wide-display headlines, pastel test cards on a cool paper ground; one big blue accent for actions. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16191F; --muted:#5D6572; --line:#DDE1DB;
  --cc:#7A93FF; --accent:#2F4BFF; --on-accent:#FFFFFF; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#7A93FF; --h-yellow:#FFD84D; --h-pink:#FF8FB1; --h-mint:#5FD3A8;
  --ok:#17795A; --warn:#B4571B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#13161B; --surface:#1D2128; --ink:#F0F2F6; --muted:#A1A8B5; --line:#2B313B;
  --accent:#8EA2FF; --on-accent:#10131C; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#6D86F5; --h-yellow:#E6C23F; --h-pink:#E0709A; --h-mint:#45BE93;
  --ok:#5FD3A8; --warn:#F0A468; color-scheme:dark}}
:root[data-theme="x-off"]{
  --bg:#13161B; --surface:#1D2128; --ink:#F0F2F6; --muted:#A1A8B5; --line:#2B313B;
  --accent:#8EA2FF; --on-accent:#10131C; --sun:#FFD84D; --on-sun:#16191F;
  --h-blue:#6D86F5; --h-yellow:#E6C23F; --h-pink:#E0709A; --h-mint:#45BE93;
  --ok:#5FD3A8; --warn:#F0A468; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;padding-block:16px 56px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;margin-bottom:18px;margin-inline:-16px;padding-inline:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:transparent;transition:translate .4s cubic-bezier(.2,.9,.2,1),background .3s,box-shadow .3s}
header.scrolled{background:color-mix(in srgb,var(--bg) 93%,transparent);box-shadow:0 1px 0 var(--line)}
header.hide{translate:0 -130%}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:1.05rem}
.logo i{width:30px;height:30px;display:inline-block;flex:none;background:radial-gradient(circle at 33% 38%,var(--h-pink) 0 30%,transparent 31%),radial-gradient(circle at 67% 38%,var(--h-yellow) 0 30%,transparent 31%),radial-gradient(circle at 50% 70%,var(--h-blue) 0 30%,transparent 31%);animation:bob 3.2s ease-in-out infinite}

.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:48px;align-items:center;padding-block:28px 40px}
.hero h1{font-size:clamp(1.6rem,3.7vw,2.6rem);font-weight:500;line-height:1.18}
.hero h1 mark{background:none;color:var(--accent);padding:0;display:inline}
.hero p.lead{font-size:1.1rem;color:var(--muted);margin-top:22px;max-width:44ch}
.hero .cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:14px 22px;font-weight:600;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.85rem;color:var(--muted)}
.brain{justify-self:center;width:min(100%,220px);aspect-ratio:1}
.brain svg{width:100%;height:100%;overflow:visible}

/* test grid */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{--tint:var(--h-blue);text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--tint) 24%,color-mix(in srgb,var(--surface) 78%,transparent));border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .25s ease-out,box-shadow .2s,translate .9s cubic-bezier(.2,.9,.2,1),rotate .9s cubic-bezier(.2,.9,.2,1);transition-delay:0s,0s,calc(var(--i,0)*70ms),calc(var(--i,0)*70ms);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));position:relative;overflow:hidden}
.card:hover{--ty:-6px;box-shadow:0 22px 40px -24px rgba(10,12,20,.5)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover::after{opacity:1}
.card .blob{width:44px;height:44px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#16191F;transition:transform .3s}
.card:hover .blob{transform:rotate(12deg) scale(1.08)}
.card h3{font-size:1.02rem;line-height:1.25}
.card p{font-size:.92rem;color:var(--muted)}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:600}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.pill.live{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t-yellow{--tint:var(--h-yellow)} .t-pink{--tint:var(--h-pink)} .t-mint{--tint:var(--h-mint)}

.promise{margin-top:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.promise div{border-top:2px solid var(--ink);padding-top:12px}
.promise b{font-family:var(--display);font-size:.95rem;display:block;margin-bottom:6px}
.promise span{color:var(--muted);font-size:.93rem}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}

/* quiz */
.stage{max-width:640px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.9rem;color:var(--muted);font-weight:500}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.qbox{min-height:430px;padding-top:34px;position:relative}
.q{position:relative;z-index:1}
.qnum{position:absolute;right:-4px;top:-6px;font-family:var(--display);font-weight:700;font-size:clamp(5rem,16vw,9rem);line-height:1;color:color-mix(in srgb,var(--ink) 7%,transparent);pointer-events:none;animation:ghost .5s ease-out}
.hint{display:none;margin-top:16px;font-size:.85rem;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
.opt.kp{animation:kp .22s ease-out}
.q{animation:inR .28s ease-out both}
.q.back{animation-name:inL}
.q h2{font-size:clamp(1.25rem,3.6vw,1.7rem);margin-bottom:26px;line-height:1.25}
.likert{display:grid;gap:10px}
.opt{animation:optIn .4s backwards;animation-delay:calc(var(--i,0)*50ms + 120ms);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s,background .12s}
.opt:hover{border-color:var(--accent);transform:translateX(4px)}
.opt:active{transform:scale(.98)}
.opt .n{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);border-bottom-width:3px;display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* gate + result */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);animation:rise .4s ease-out both}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.field{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0 12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted);margin-bottom:16px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{color:var(--warn);font-size:.9rem;margin-bottom:10px}
.stack{display:grid;gap:22px}
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,13vw,5.5rem);line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-bottom:10px}
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--h-mint),var(--h-yellow),var(--h-pink));margin-top:14px}
.meter i{position:absolute;top:-6px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);left:0;transition:left 1.1s cubic-bezier(.2,1.2,.4,1)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:8px}
.prose p+p{margin-top:12px}
.prose ul,.prose ol{padding-left:20px;margin:12px 0 0;display:grid;gap:8px}
.prose h3{font-size:1rem;margin:18px 0 6px}
.dims{display:grid;gap:14px;margin-top:18px}
.dim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:.92rem}
.dim .v{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.dim.top .v{color:var(--ink)}
.dim .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.dim .track i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .9s cubic-bezier(.2,1,.4,1)}
.dim.top .track i{background:var(--h-pink)}
.driver{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.driver h3{font-size:1rem;margin-bottom:6px}
.driver .act{margin-top:8px;font-weight:500}
.box{border:1.5px dashed var(--line);border-radius:18px;padding:18px}
.box h3{font-size:1rem;margin-bottom:8px}
.offer{background:color-mix(in srgb,var(--h-yellow) 30%,var(--surface));border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,32px);display:grid;gap:16px}
.offer h3{font-size:1.25rem}
.offer .days{display:grid;gap:6px;font-size:.93rem;padding:0;margin:0;list-style:none}
.offer .days li{display:flex;gap:10px}
.offer .days b{flex:none;width:52px;color:var(--muted);font-weight:600}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;justify-self:start}
.timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--h-pink);animation:pulse 1.2s infinite}
.price{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.price b{font-family:var(--display);font-size:1.8rem}
.price s{color:var(--muted)}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.92rem;z-index:9;max-width:calc(100% - 32px);animation:rise .25s ease-out both}


/* ---- awwwards layer ---- */
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;z-index:50}
#cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:9999;opacity:0;scale:.5;transition:scale .4s cubic-bezier(.2,.9,.2,1),opacity .2s;will-change:translate,scale}
#cur.on{opacity:1}
#cur.hot{scale:2.4;background:color-mix(in srgb,var(--ink) 8%,transparent);box-shadow:inset 0 0 0 1.2px var(--ink)}
#cur.down{scale:.36}
#cur.hot.down{scale:2}
#cur.txt{opacity:0}
html.has-cur,html.has-cur *{cursor:none!important}
html.has-cur input[type=email],html.has-cur input[type=text],html.has-cur textarea{cursor:text!important}
.anim-ready [data-rv]:not(.in){translate:0 52px;rotate:var(--rr,0deg)}
[data-rv]{transition:translate .9s cubic-bezier(.2,.9,.2,1),rotate .9s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.14em;margin-block:-.14em}
.w>span{display:inline-block;animation:wordUp .95s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms + 120ms)}
.hero-copy{will-change:translate}
.brain{will-change:translate,rotate}
.cue{margin-top:34px;display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cue i{width:1px;height:34px;background:var(--muted);transform-origin:50% 0;animation:cue 1.8s ease-in-out infinite}
.mq{overflow:hidden;border-block:1px solid var(--line);margin-block:36px 0;display:block}
.mq-row{display:block;overflow:hidden;padding-block:15px}
.mq-row.a{background:none;color:var(--muted);transform:none}
.mq-t{display:flex;align-items:center;width:max-content;white-space:nowrap;font-family:var(--body);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;will-change:transform}
.mq-t span{display:block}
.dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin:0 1.8rem;flex:none}
.mani{height:300vh;margin-block:40px 0;position:relative}
.mani-in{position:sticky;top:0;height:100vh;height:100svh;display:grid;align-content:center;gap:28px}
.mani-in::before{content:attr(data-k);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mbar{width:min(220px,40vw);height:1.5px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(var(--mp,0))}
.mani-p{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,5.4vw,4.7rem);line-height:1.1;letter-spacing:-.02em;max-width:21ch;text-wrap:balance;transform-origin:0 50%}
.mw{display:inline-block;color:color-mix(in srgb,var(--ink) calc(var(--t,0)*100%),var(--line));opacity:calc(.35 + var(--t,0)*.65);translate:0 calc((1 - var(--t,0))*.28em);will-change:opacity,translate}
@media (prefers-reduced-motion:reduce){.mw{--t:1;filter:none}}
html:not(.anim-ready) .mani{height:auto}html:not(.anim-ready) .mani-in{position:static;height:auto;padding-block:72px}html:not(.anim-ready) .mw{--t:1;filter:none}
.scene{height:300vh;margin-top:72px}
.scene-in{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100svh;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.scene h2{font-size:clamp(1.5rem,3.4vw,2.2rem);margin-bottom:26px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.steps li{display:flex;gap:16px;color:var(--muted);transition:color .3s,translate .4s}
.steps .sn{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;transition:background .3s,color .3s,border-color .3s}
.steps h3{font-size:1.05rem;margin-bottom:4px;color:inherit}
.steps p{font-size:.93rem}
.scene[data-step="0"] .steps li:nth-child(1),.scene[data-step="1"] .steps li:nth-child(2),.scene[data-step="2"] .steps li:nth-child(3){color:var(--ink);translate:8px 0}
.scene[data-step="0"] .steps li:nth-child(1) .sn,.scene[data-step="1"] .steps li:nth-child(2) .sn,.scene[data-step="2"] .steps li:nth-child(3) .sn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rail{height:4px;background:var(--line);border-radius:9px;margin-top:28px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.vis{position:relative;aspect-ratio:1/1;max-height:min(80vh,460px);width:100%;justify-self:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.v{position:absolute;inset:0;padding:clamp(16px,3vw,28px);display:grid;align-content:center;gap:12px;opacity:0;transform:scale(.94) translateY(20px);transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.2,1)}
.scene[data-step="0"] .v1,.scene[data-step="1"] .v2,.scene[data-step="2"] .v3{opacity:1;transform:none}
.vq p{font-family:var(--display);font-weight:500;font-size:clamp(.95rem,2vw,1.15rem);line-height:1.3}
.vc{display:flex;gap:8px;margin-top:18px}
.vc b{flex:1;height:50px;border-radius:12px;border:1.5px solid var(--line);border-bottom-width:4px;display:grid;place-items:center;font-family:var(--display);transition:background .2s,transform .2s,border-color .2s}
.vc b.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);transform:translateY(3px);border-bottom-width:1.5px}
.vk{font-size:.8rem;color:var(--muted)}
.vcap{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vr{display:grid;gap:4px;font-size:.78rem;min-width:0}
.vt{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.vt i{display:block;height:100%;border-radius:9px;background:var(--accent);width:calc(var(--t)*1% * var(--k,0))}
.vr.hi .vt i{background:var(--h-pink)}
.vt3{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:16px;transition:background .3s,border-color .3s;font-weight:500}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative;transition:background .3s,border-color .3s}
.vt3.done{background:color-mix(in srgb,var(--h-mint) 22%,var(--surface));border-color:var(--h-mint)}
.vt3.done .tick{background:var(--h-mint);border-color:var(--h-mint)}
.vt3.done .tick::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #16191F;border-width:0 2.5px 2.5px 0;rotate:45deg}
.final{margin-top:72px;background:var(--ink);color:var(--bg);border-radius:28px;overflow:hidden;padding:clamp(32px,7vw,64px) clamp(22px,5vw,56px);display:grid;gap:24px;justify-items:start}

.rip .fl{width:44vmin;height:44vmin;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 60%,transparent) 0%,color-mix(in srgb,var(--rc) 30%,transparent) 40%,transparent 70%);animation:ripFl 1.1s cubic-bezier(.15,.7,.2,1) forwards}
.rip .rg{width:28vmin;height:28vmin;background:radial-gradient(circle,transparent 56%,color-mix(in srgb,var(--rc) 60%,transparent) 62%,transparent 70%);animation:ripRg 1.1s cubic-bezier(.15,.65,.2,1) forwards}
.rip .rg.r2{animation-duration:1.4s;animation-delay:.12s;opacity:0}
@keyframes ripFl{0%{scale:.05;opacity:.9}100%{scale:1.15;opacity:0}}
@keyframes ripRg{0%{scale:.05;opacity:.9}100%{scale:1.5;opacity:0}}
#glow2,#glow3{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:-1;opacity:0;transition:opacity .6s;will-change:translate}
#glow2{width:48vmin;height:48vmin;margin:-24vmin 0 0 -24vmin;background:radial-gradient(circle,color-mix(in srgb,var(--h-pink) 70%,transparent) 0%,color-mix(in srgb,var(--h-pink) 30%,transparent) 40%,transparent 70%)}
#glow3{width:42vmin;height:42vmin;margin:-21vmin 0 0 -21vmin;background:radial-gradient(circle,color-mix(in srgb,var(--h-yellow) 80%,transparent) 0%,color-mix(in srgb,var(--h-yellow) 34%,transparent) 40%,transparent 70%)}
#glow2.on{opacity:.6}#glow3.on{opacity:.6}
@media (hover:none),(pointer:coarse),(max-width:760px){#glow2,#glow3,.rip{display:none}}

.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:inset 0 1px 3px rgba(255,255,255,.55);transition:transform .2s}

 bands:[
  {max:39,id:"low",
   ua:{h:"Здорова самокритика",p:["Ти сумніваєшся рівно стільки, щоб не втратити почуття реальності, і не настільки, щоб це псувало життя. Це нормально, і це добре.","Самозванець у тебе не прописаний. Він іноді дзвонить у двері, але ти не відчиняєш."],tr:["Запиши одну річ, яка вийшла в тебе цього тижня. Просто для архіву.","Коли хвалять, скажи «дякую» без виправдань."],bullets:[]},
   en:{h:"Healthy Self-Doubt",p:["You doubt yourself just enough to stay grounded, and not enough to spoil your days. That's normal, and it's good.","The imposter isn't registered at your address. It rings the bell sometimes, but you don't open the door."],tr:["Write down one thing that went well this week. Just for the archive.","When someone praises you, say “thank you” without disclaimers."],bullets:[]}},
  {max:64,id:"mid",
   ua:{h:"Внутрішній критик підробляє на півставки",p:["Самозванець заходить у гості, але ще не розпакував валізи. Він з'являється в нових ситуаціях: нова робота, нова роль, великий дедлайн.","Хороша новина: на цьому етапі його дуже легко приручити. Погана: якщо його годувати перфекціонізмом, він почне ночувати."],tr:["Запиши 3 речі, які вдалися тобі цього тижня, і які твої дії до цього привели.","Замість «вибач за турботу» спробуй «дякую, що знайшов час»."],bullets:[]},
   en:{h:"Your Inner Critic Works Part-Time",p:["The imposter visits but hasn't unpacked yet. It shows up in new situations: a new job, a new role, a big deadline.","The good news: at this stage it's easy to tame. The bad news: feed it perfectionism and it starts sleeping over."],tr:["Write down 3 things you did this week and what exactly you did to make them happen.","Swap “sorry for bothering you” for “thanks for making time.”"],bullets:[]}},
  {max:100,id:"high",
   ua:{h:"Самозванець у тебе на ставці (і працює понаднормово)",p:["Привіт. Спершу найважливіше: з тобою все гаразд. Це не діагноз і не «дефект характеру». Це твій мозок, який вирішив, що найкраща стратегія виживання: постійно перевіряти, чи тебе ще не «викрили».","Що, імовірно, відбувається:"],
     bullets:["<b>Похвала відскакує, як горох від стіни.</b> Ти чуєш «молодець», а всередині: «Ну, це було легко». Успіх завжди зарахований комусь іншому: удачі, команді, фазі місяця.","<b>Помилка прилипає, як жуйка до підошви.</b> Одне невдале слово на мітингу ти можеш програвати в голові до вівторка.","<b>Ти вибачаєшся за існування.</b> «Вибач, що відволікаю», «Вибач, якщо це дурне питання». Іноді хочеться вибачитись навіть перед дверима.","<b>Ти живеш із внутрішнім аудитором,</b> який приходить без запрошення і завжди знаходить «порушення»."],
     after:"Найчастіше цей патерн трапляється у людей, які старанні, відповідальні й мають високі стандарти. Парадокс: ті, хто справді не вміє щось робити, зазвичай цього не помічають. Тож твої сумніви ще не доказ некомпетентності. Радше навпаки.",
     tr:["Запиши 3 речі, які вдалися тобі цього тижня, і поруч дії, що до цього привели (не «пощастило», а факти).","Коли тебе хвалять, відповідай просто: «Дякую». Без «та це дрібниці».","Замість «вибач за турботу» спробуй «дякую, що знайшов час»."]},
   en:{h:"The Imposter Has Your Number (and Is Working Overtime)",p:["Hi. First, the important part: you're okay. This isn't a diagnosis or a character flaw. It's your brain deciding the best survival strategy is to keep checking whether you've been “found out” yet.","What's probably going on:"],
     bullets:["<b>Praise bounces off like a pea off a wall.</b> You hear “great job” and inside: “It was easy anyway.” Success always gets credited to someone else: luck, the team, the phase of the moon.","<b>Mistakes stick like gum on a shoe.</b> One awkward sentence in a meeting can replay in your head until Tuesday.","<b>You apologize for existing.</b> “Sorry to bother you,” “Sorry if this is a dumb question.” Sometimes you could apologize to the door.","<b>You live with an internal auditor</b> who shows up uninvited and always finds “violations.”"],
     after:"This pattern most often shows up in people who are diligent, responsible and hold high standards. The paradox: people who truly can't do something rarely notice. So your doubt isn't proof of incompetence. If anything, the opposite.",
     tr:["Write down 3 things you did this week, and next to each, “what exactly did I do to make it happen” (actions, not “luck”).","When someone praises you, answer just: “Thank you.” No “oh, it was nothing.”","Swap “sorry for bothering you” for “thanks for making time.”"]}}
 ],
 who:{
  ua:["Самодопомоги зазвичай достатньо, якщо сумніви виникають у нових ситуаціях (нова робота, нова роль) і не руйнують твій побут.","Варто звернутись до психотерапевта, якщо це триває місяцями, супроводжується безсонням, постійною тривогою чи відчуттям порожнечі, або ти уникаєш можливостей через страх «викриття». Добре працює <b>КПТ</b> (когнітивно-поведінкова терапія) для роботи з думками-«вироками», а <b>схема-терапія</b> допомагає, коли за сумнівами стоять глибокі установки з раннього досвіду. Це не діагноз, а орієнтир."],
  en:["Self-help is usually enough if doubts appear in new situations (new job, new role) and don't wreck your daily life.","Consider a therapist if this has lasted for months, comes with insomnia, constant anxiety or a sense of emptiness, or you avoid opportunities out of fear of being “exposed.” <b>CBT</b> (cognitive behavioral therapy) works well on those verdict-like thoughts, and <b>schema therapy</b> helps when the doubts trace back to deep beliefs from early life. This isn't a diagnosis, just a compass."]},

var NEW=[{"id":"shadow","kind":"type","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Придушена злість","why":"Ти звик(-ла) бути «зручним(-ою)», тож злість не зникає, а йде в підвал: у сарказм, мовчанку, втому чи раптовий вибух через дрібницю.","act":"Сьогодні назви злість вголос у безпечному місці (нотатки, голосове собі): «Я злюсь, бо…». Не для дій, а щоб вона з'явилась на світло.","res":{"h":"Твоя тінь: Мовчазний вулкан","p":["Найсильніше в тобі те, що ти звик(-ла) не показувати злість. Ззовні ти спокійний(-а) й дипломатичний(-а), а всередині копиться напруга, яку ти називаєш «та нічого».","Тінь не ворог: злість є сигналом, що межу перейшли. Проблема не в ній, а в тому, що вона не має дозволеної дороги назовні, тому виходить боком: втомою, сарказмом, відстороненістю."],"tr":["Замість «та нічого» спробуй у малому: «Мені це не підходить».","Після напруженої розмови запиши за 2 хвилини, що саме тебе зачепило.","Проси про одну маленьку річ щодня, навіть якщо страшно «набридати»."],"bullets":[]}},"en":{"n":"Suppressed anger","why":"You're used to being the easy one, so anger doesn't vanish, it goes to the basement: into sarcasm, silence, fatigue or a sudden blow-up over something small.","act":"Today name the anger out loud somewhere safe (notes, a voice memo): “I'm angry because…”. Not to act on it, just to bring it into the light.","res":{"h":"Your shadow: The Silent Volcano","p":["The strongest thing in you is that you're used to not showing anger. Outwardly you're calm and diplomatic, while inside tension builds that you call “it's nothing.”","The shadow isn't an enemy: anger is a signal that a boundary was crossed. The problem isn't the anger itself but that it has no permitted way out, so it leaks sideways: through fatigue, sarcasm, distance."],"tr":["Instead of “it's nothing,” try in small things: “That doesn't work for me.”","After a tense conversation, write for 2 minutes what exactly got to you.","Ask for one small thing a day, even if it feels like “bothering” someone."],"bullets":[]}},"items":[{"ua":"Я довго мовчу, коли мене ображають, а потім раптово «вибухаю» через дрібницю.","en":"I stay quiet for a long time when I'm hurt, then suddenly blow up over something small.","r":0},{"ua":"Мені легше пожартувати чи змовчати, ніж сказати прямо, що мені не подобається.","en":"It's easier to joke or stay silent than to say plainly that I don't like something.","r":0},{"ua":"Коли я злюсь, я одразу відчуваю провину за це.","en":"When I get angry, I immediately feel guilty about it.","r":0},{"ua":"Мої найрізкіші думки про інших я нікому не озвучую.","en":"I never say my sharpest thoughts about others out loud.","r":0},{"ua":"Іноді я помічаю, що стискаю щелепи чи кулаки, хоч «нібито все нормально».","en":"Sometimes I notice I'm clenching my jaw or fists even though “everything is fine.”","r":0}]},{"ua":{"n":"Заздрість і порівняння","why":"Заздрість це компас: вона показує, чого ти насправді хочеш, але не дозволяєш собі. Сорому тут немає, це корисні дані.","act":"Запиши трьох людей, кому ти заздриш, і поруч одне слово: що саме тобі в них відгукується. Це твій список бажань.","res":{"h":"Твоя тінь: Внутрішній рахівник","p":["Найяскравіша твоя тінь це порівняння. Ти постійно звіряєшся з іншими, і кожен чужий успіх відчувається як мінус на твоєму рахунку, хоч насправді рахунки в вас різні.","Це не «ти поганий(-а)». Це значить, що ти чітко бачиш, чого прагнеш. Заздрість показує напрямок, якщо перестати її соромитись і почати читати."],"tr":["Обмеж скрол на тиждень: 20 хвилин на день замість годин.","Заміни «чому не я» на «що я хочу з цього взяти собі».","Раз на тиждень записуй одну свою перемогу, без порівнянь."],"bullets":[]}},"en":{"n":"Envy and comparison","why":"Envy is a compass: it shows what you actually want but don't allow yourself. There's no shame in it, it's useful data.","act":"Write down three people you envy and next to each one word: what exactly resonates. That's your wish list.","res":{"h":"Your shadow: The Inner Accountant","p":["Your brightest shadow is comparison. You're constantly checking yourself against others, and every success of theirs feels like a minus on your account, though your accounts are different.","It doesn't mean “you're bad.” It means you see clearly what you strive for. Envy shows a direction once you stop being ashamed of it and start reading it."],"tr":["Limit scrolling for a week: 20 minutes a day instead of hours.","Swap “why not me” for “what do I want to take from this for myself.”","Once a week write down one win of your own, no comparisons."],"bullets":[]}},"items":[{"ua":"Чужі успіхи можуть зіпсувати мені настрій, навіть якщо я щиро вітаю людину.","en":"Other people's wins can ruin my mood even when I sincerely congratulate them.","r":0},{"ua":"Я часто гортаю чужі життя в соцмережах і потім почуваюсь гірше.","en":"I often scroll through other people's lives online and feel worse afterwards.","r":0},{"ua":"Мені важко, коли хтось із мого кола раптом обходить мене в чомусь важливому.","en":"It's hard when someone in my circle suddenly overtakes me at something important.","r":0},{"ua":"Я ловлю себе на думці «чому їм так просто, а мені ні».","en":"I catch myself thinking “why is it so easy for them and not for me.”","r":0},{"ua":"Я рахую, хто скільки зробив, заробив чи досяг, навіть коли ніхто не просить.","en":"I keep count of who has done, earned or achieved how much, even when nobody asks.","r":0}]},{"ua":{"n":"Потреба контролювати","why":"Контроль це спосіб не відчувати тривогу невизначеності. Він працює, поки не починає з'їдати спонтанність і довіру.","act":"Відпусти одну дрібницю цього тижня: не перевіряй, не виправляй, не нагадуй. Просто подивись, що станеться.","res":{"h":"Твоя тінь: Диригент без оркестру","p":["Твоя головна тінь це контроль. Ти тримаєш усе в руках, бо так безпечніше, і це справді дає результат. Але ціна висока: втома, і відчуття, що ніхто не вміє так, як ти.","Під потребою контролю зазвичай живе страх, що без тебе все розвалиться. Хороша новина: світ витримує, коли ти відпускаєш на 10%."],"tr":["Обери одну задачу й віддай її без інструкцій на 5 сторінок.","Після делегування не перевіряй хоча б добу.","Запитай себе: «Що найгірше може статися, і чи виживу я?»"],"bullets":[]}},"en":{"n":"Need for control","why":"Control is a way not to feel the anxiety of uncertainty. It works until it starts eating spontaneity and trust.","act":"Let go of one small thing this week: don't check, fix or remind. Just watch what happens.","res":{"h":"Your shadow: The Conductor","p":["Your main shadow is control. You keep everything in your hands because it feels safer, and it really does get results. But the price is high: exhaustion, and the sense that nobody does it like you do.","Under the need for control usually lives a fear that things will fall apart without you. Good news: the world holds up when you let go of 10%."],"tr":["Pick one task and hand it over without a five-page manual.","After delegating, don't check for at least a day.","Ask yourself: “What's the worst that could happen, and would I survive it?”"],"bullets":[]}},"items":[{"ua":"Мені некомфортно, коли справа йде не за моїм планом.","en":"I feel uncomfortable when things don't go according to my plan.","r":0},{"ua":"Я часто переробляю чужу роботу «по-своєму», бо так буде надійніше.","en":"I often redo other people's work “my way” because it'll be more reliable.","r":0},{"ua":"Я заздалегідь програю в голові різні сценарії, щоб нічого не застало зненацька.","en":"I play out different scenarios in my head beforehand so nothing catches me off guard.","r":0},{"ua":"Коли я не контролюю ситуацію, моє тіло напружується.","en":"When I don't control a situation, my body tenses up.","r":0},{"ua":"Мені важко делегувати, навіть коли я втомлений(-а).","en":"It's hard for me to delegate even when I'm exhausted.","r":0}]},{"ua":{"n":"Маска ідеальної людини","why":"Маска захищає від критики, але разом із критикою тебе ховає й від близькості: тебе люблять за образ, і це самотньо.","act":"Покажи одній безпечній людині маленьку недосконалість: помилку, сумнів чи втому. Подивись, як вона відреагує.","res":{"h":"Твоя тінь: Людина з вітрини","p":["Твоя найбільша тінь це маска «хорошої людини». Ти вмієш бути приємним(-ою) і правильним(-ою), і за це тебе цінують, але все, що не вписується в образ, відправляється в підвал.","Це дорогий обмін: ти втрачаєш справжність, і близькі люди люблять лише ту версію, яку ти їм показуєш."],"tr":["Раз на день скажи «ні» чомусь дрібному.","Назви одну емоцію, яку ти зазвичай ховаєш, одній людині.","Запиши, чого ти хочеш, а не що «треба»."],"bullets":[]}},"en":{"n":"The perfect-person mask","why":"The mask protects you from criticism, but together with criticism it hides you from closeness: people love the image, and that's lonely.","act":"Show one safe person a small imperfection: a mistake, a doubt or tiredness. See how they react.","res":{"h":"Your shadow: The Shop Window","p":["Your biggest shadow is the “good person” mask. You're good at being pleasant and proper, and you're valued for it, but everything that doesn't fit the image gets sent to the basement.","It's an expensive trade: you lose authenticity. People close to you get the chance to love only the version you already show."],"tr":["Once a day say “no” to something small.","Name one emotion you usually hide to one person.","Write down what you want, not what you “should.”"],"bullets":[]}},"items":[{"ua":"Я підлаштовуюсь під людей так, що вдома почуваюсь не собою.","en":"I adapt to people so much that at home I feel like I'm not myself.","r":0},{"ua":"Мені важливо, щоб про мене думали як про хорошу, адекватну людину.","en":"It matters to me that people think of me as a good, sensible person.","r":0},{"ua":"Я рідко кажу «ні», навіть коли дуже не хочу.","en":"I rarely say “no,” even when I really don't want to.","r":0},{"ua":"Я ховаю свої слабкості навіть від близьких.","en":"I hide my weaknesses even from people close to me.","r":0},{"ua":"Я переживаю, що, коли побачать «справжнього мене», люблять менше.","en":"I worry that if they see the “real me,” they'll like me less.","r":0}]},{"ua":{"n":"Прихована потреба в увазі","why":"Бажання бути помітним(-ою) і потрібним(-ою) це нормально. Тінню воно стає, коли ти соромишся його і шукаєш увагу обхідними шляхами.","act":"Попроси про увагу прямо: «Мені зараз потрібна твоя підтримка». Це страшніше за натяки, але набагато ефективніше.","res":{"h":"Твоя тінь: Невидимий актор","p":["Твоя головна тінь це глибока потреба в увазі, яку ти не дозволяєш собі визнати. Ти вмієш бути скромним(-ою), але всередині хочеш, щоб тебе побачили саме таким(-ою), яким(-ою) ти є.","Це не егоїзм, а базова людська потреба. Коли її пригнічувати, вона шукає хитрих шляхів: натяки, образи, перевірка людей."],"tr":["Скажи близькій людині: «Мені важливо, коли ти…».","Дозволь собі прийняти комплімент без «та ні, нічого особливого».","Знайди місце, де тебе чують: гурток, чат, друг."],"bullets":[]}},"en":{"n":"Hidden need for attention","why":"Wanting to be noticed and needed is normal. It becomes a shadow when you're ashamed of it and seek attention in roundabout ways.","act":"Ask for attention directly: “I need your support right now.” It's scarier than hints but far more effective.","res":{"h":"Your shadow: The Hidden Spotlight","p":["Your main shadow is a deep need for attention that you don't let yourself admit. You know how to be modest, but inside you want to be seen exactly as you are.","That's not selfishness, it's a basic human need. When suppressed, it looks for sneaky routes: hints, hurt feelings, testing people."],"tr":["Tell someone close: “It matters to me when you…”","Let yourself accept a compliment without “oh, it's nothing special.”","Find a place where you're heard: a club, a chat, a friend."],"bullets":[]}},"items":[{"ua":"Мені приємно, коли мене хвалять чи пам'ятають, але соромно в цьому зізнатись.","en":"I like being praised or remembered, but I'm embarrassed to admit it.","r":0},{"ua":"Іноді я чекаю, що хтось сам запитає, як я, і ображаюсь, якщо ні.","en":"Sometimes I wait for someone to ask how I'm doing, and get hurt if they don't.","r":0},{"ua":"Я думаю про те, як виглядаю в очах інших, частіше, ніж хотів(-ла) би.","en":"I think about how I look in other people's eyes more often than I'd like.","r":0},{"ua":"Мене зачіпає, коли мої повідомлення залишаються без відповіді.","en":"It gets to me when my messages are left unanswered.","r":0},{"ua":"Мені важливо бути «особливим(-ою)» для когось.","en":"It's important for me to be “special” to someone.","r":0}]},{"ua":{"n":"Холодна дистанція","why":"Дистанція здається силою, але часто це захист: якщо ніхто не підходить близько, ніхто й не зашкодить.","act":"Залиш двері на 5 см відчиненими: відповідай на повідомлення від близьких у той же день, навіть коротко.","res":{"h":"Твоя тінь: Крижаний острів","p":["Твоя головна тінь це дистанція. Ти самодостатній(-я), і це справжня сила, але є нюанс: частина цієї самодостатності виросла із захисту, а не з вибору.","Ти не холодний(-а). Просто колись близькість була небезпечною, і мозок запам'ятав. Тепер його варто потихеньку переконувати, що безпечні люди теж існують."],"tr":["Раз на тиждень поділись з кимось однією справжньою думкою.","Проси про допомогу в дрібниці: це тренування довіри.","Помічай, коли тікаєш, і питай себе: «Від чого?»"],"bullets":[]}},"en":{"n":"Cold distance","why":"Distance looks like strength, but it's often protection: if nobody gets close, nobody can hurt you.","act":"Leave the door open 5 cm: reply to messages from people close to you the same day, even briefly.","res":{"h":"Your shadow: The Ice Island","p":["Your main shadow is distance. You're self-sufficient, and that's real strength, but there's a catch: part of that self-sufficiency grew from protection rather than choice.","You're not cold. Closeness was once unsafe, and your brain remembered. Now it's worth slowly convincing it that safe people exist too."],"tr":["Once a week share one real thought with someone.","Ask for help with something small: it's trust training.","Notice when you run, and ask yourself: “From what?”"],"bullets":[]}},"items":[{"ua":"Коли хтось наближається занадто сильно, мені хочеться відсторонитись.","en":"When someone gets too close, I want to pull away.","r":0},{"ua":"Мені легше розв'язувати проблеми самому(-ій), ніж просити допомоги.","en":"It's easier to solve problems alone than to ask for help.","r":0},{"ua":"Я можу «вимкнутись» емоційно, коли стає надто складно.","en":"I can “switch off” emotionally when things get too hard.","r":0},{"ua":"Мені потрібно багато особистого простору, більше, ніж іншим.","en":"I need a lot of personal space, more than others do.","r":0},{"ua":"Мене лякають розмови про почуття.","en":"Conversations about feelings scare me.","r":0}]}],"who":{"ua":["Тінь це не діагноз і не ярлик, а просто частини тебе, які ти поки не використовуєш свідомо. Самоспостереження, щоденник і розмови з близькими зазвичай допомагають.","Варто поговорити з психотерапевтом, якщо придушені емоції проявляються в безсонні, панічних атаках, постійній втомі чи гострих конфліктах. Добре працюють схема-терапія та терапія прийняття й відповідальності. Це не діагноз, а орієнтир."],"en":["The shadow is not a diagnosis or a label, just parts of you that you aren't using consciously yet. Self-observation, journaling and honest talks with people close to you usually help.","Consider a therapist if suppressed emotions show up as insomnia, panic attacks, constant fatigue or sharp conflicts. Schema therapy and acceptance and commitment therapy work well. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Підвал без монстрів: як подружитись зі своєю тінню","d":"Готовий PDF-гайд по твоїй тіні: як її розпізнати, чому вона виникає і як повернути собі енергію, що йде на її приховування. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Що таке тінь і чому вона є в кожного","Шість типів тіні та їхні сигнали в тілі й поведінці","Вправи: діалог із тінню, письмові практики, безпечні експерименти","Як використати тінь як ресурс: злість, заздрість, дистанція","Коли самодопомоги мало і до кого звертатись"],"bonus":["щоденник тіні на 14 днів","шаблон розмови «Мені важливо»"]},"en":{"t":"Basement Without Monsters: Making Friends With Your Shadow","d":"A ready-made PDF guide to your shadow: how to recognize it, why it forms, and how to get back the energy spent hiding it. No filler or motivational quotes. It lands in your inbox right after payment.","days":["What the shadow is and why everyone has one","Six shadow types and their signals in body and behavior","Exercises: dialogue with the shadow, writing practices, safe experiments","Using the shadow as a resource: anger, envy, distance","When self-help is not enough and who to turn to"],"bonus":["14-day shadow journal","“It matters to me” conversation template"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твоя тінь за 6 темами","profileNote":"Найвища тема це твоя головна тінь. Інші показують, що теж звучить у тобі."},"en":{"profile":"Your shadow across 6 themes","profileNote":"The highest theme is your main shadow. The others show what else speaks in you."}}},{"id":"burnout","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Виснаження","why":"Це ядро вигорання: тіло й мозок працюють на резерві. Відпочинок вихідними вже не «перезаряджає» повністю.","act":"Цього тижня заплануй один справжній відновлювальний слот (сон, прогулянка без телефона) і став його в календар як нараду."},"en":{"n":"Exhaustion","why":"This is the core of burnout: body and brain run on reserve. A weekend of rest no longer recharges you fully.","act":"This week schedule one real recovery slot (sleep, a walk without your phone) and put it in your calendar like a meeting."},"items":[{"ua":"Зранку я прокидаюсь уже втомленим(-ою).","en":"I wake up already tired in the morning.","r":0},{"ua":"Після роботи чи навчання в мене не лишається сил ні на що інше.","en":"After work or study I have no energy left for anything else.","r":0},{"ua":"Мені потрібна кава чи енергетик, щоб просто функціонувати.","en":"I need coffee or an energy drink just to function.","r":0},{"ua":"Я часто відчуваю, що «батарейка на 1%».","en":"I often feel like my battery is at 1%.","r":0},{"ua":"Вихідні допомагають мені повністю відновитись.","en":"The weekend lets me recover fully.","r":1}]},{"ua":{"n":"Цинізм і відстороненість","why":"Коли ресурсу мало, мозок вмикає захист: «мені все одно». Це не лінь, а спосіб не відчувати перевантаження.","act":"Згадай, що колись тебе тут цікавило. Запиши одну причину, через яку ти починав(-ла), і одну річ, яка досі нормальна."},"en":{"n":"Cynicism and detachment","why":"When resources are low, the brain switches on protection: “I don't care.” It isn't laziness, it's a way not to feel overload.","act":"Remember what once interested you here. Write one reason you started, and one thing that is still okay."},"items":[{"ua":"Я ловлю себе на думці «яка різниця, нічого не змінюється».","en":"I catch myself thinking “what's the difference, nothing changes.”","r":0},{"ua":"Колеги чи одногрупники дратують мене сильніше, ніж раніше.","en":"Colleagues or classmates annoy me more than they used to.","r":0},{"ua":"Я став(-ла) формальнішим(-ою) і холоднішим(-ою) з людьми.","en":"I've become more formal and colder with people.","r":0},{"ua":"Те, що раніше надихало, тепер викликає байдужість.","en":"What used to inspire me now leaves me indifferent.","r":0},{"ua":"Мені досі цікаво те, чим я займаюсь.","en":"I'm still interested in what I do.","r":1}]},{"ua":{"n":"Відчуття неефективності","why":"Виснажений мозок гірше концентрується, роботи виходить менше, і тоді з'являється відчуття «я нічого не встигаю». Це симптом перевантаження, а не твоя недостатність.","act":"Зменш план дня на 30% і запиши лише три реальні справи. Закриття трьох справ дає мозку відчуття контролю."},"en":{"n":"Feeling ineffective","why":"An exhausted brain concentrates worse, you get less done, and then comes the feeling “I'm getting nothing done.” It's a symptom of overload, not of your inadequacy.","act":"Cut your day's plan by 30% and write only three real tasks. Closing three tasks gives the brain a sense of control."},"items":[{"ua":"Я роблю більше, а результат здається меншим.","en":"I do more and the result feels smaller.","r":0},{"ua":"Мені складно зосередитись на простих завданнях.","en":"I find it hard to focus on simple tasks.","r":0},{"ua":"Я часто забуваю дрібниці, які раніше пам'ятав(-ла) без зусиль.","en":"I often forget little things I used to remember effortlessly.","r":0},{"ua":"Я відчуваю, що не справляюсь з тим, з чим колись справлявся(-лась).","en":"I feel I can't cope with what I once coped with.","r":0},{"ua":"Я переважно задоволений(-а) якістю того, що роблю.","en":"I'm mostly satisfied with the quality of what I do.","r":1}]},{"ua":{"n":"Сон і відновлення","why":"Сон це головний інструмент відновлення. Коли він порушений, виснаження і дратівливість лише посилюються.","act":"Постав фіксований час відбою й за годину до нього прибери екрани. Спробуй 7 днів поспіль."},"en":{"n":"Sleep and recovery","why":"Sleep is the main recovery tool. When it's disrupted, exhaustion and irritability only get worse.","act":"Set a fixed bedtime and put screens away an hour before. Try it for 7 days in a row."},"items":[{"ua":"Мені важко заснути, бо голова зайнята роботою чи навчанням.","en":"I find it hard to fall asleep because my head is busy with work or study.","r":0},{"ua":"Я прокидаюсь серед ночі й думаю про справи.","en":"I wake up in the night thinking about tasks.","r":0},{"ua":"Я сплю достатньо, але не почуваюсь відпочилим(-ою).","en":"I sleep enough but don't feel rested.","r":0},{"ua":"Я «компенсую» втому солодким, серіалами чи скролом замість справжнього відпочинку.","en":"I “compensate” for tiredness with sweets, series or scrolling instead of real rest.","r":0},{"ua":"У мене є ритуали, які реально допомагають мені розслабитись.","en":"I have rituals that truly help me relax.","r":1}]},{"ua":{"n":"Межі між справами й життям","why":"Без меж робота просочується в усе. Вигорання часто не від кількості годин, а від того, що ти ніколи по-справжньому не «вимикаєшся».","act":"Визнач час, після якого ти не відповідаєш на робочі повідомлення. Скажи про це вголос хоча б одній людині."},"en":{"n":"Boundaries between work and life","why":"Without boundaries work seeps into everything. Burnout often comes not from the number of hours but from never truly switching off.","act":"Pick a time after which you don't answer work messages. Say it out loud to at least one person."},"items":[{"ua":"Я перевіряю робочі чати ввечері чи на вихідних.","en":"I check work chats in the evening or on weekends.","r":0},{"ua":"Мені важко сказати «ні» новому завданню, навіть якщо я перевантажений(-а).","en":"I find it hard to say “no” to a new task even when I'm overloaded.","r":0},{"ua":"Я відчуваю провину, коли відпочиваю.","en":"I feel guilty when I rest.","r":0},{"ua":"Робота чи навчання займають більшу частину моїх думок навіть у вільний час.","en":"Work or study takes most of my thoughts even in my free time.","r":0},{"ua":"Я легко відділяю робочий час від особистого.","en":"I easily separate work time from personal time.","r":1}]},{"ua":{"n":"Радість і сенс","why":"Коли пропадає радість, це сигнал не «ти слабкий(-а)», а «ресурс закінчився». Сенс повертається разом із силами.","act":"Додай у тиждень одну річ, яка не для результату: хобі, друг, прогулянка. Обов'язково без оцінки й мети."},"en":{"n":"Joy and meaning","why":"When joy disappears, it's a signal not “you're weak” but “the resource has run out.” Meaning returns along with energy.","act":"Add one thing to your week that isn't for results: a hobby, a friend, a walk. Without evaluation or a goal."},"items":[{"ua":"Речі, які мені подобались, тепер не приносять задоволення.","en":"Things I used to enjoy no longer bring me pleasure.","r":0},{"ua":"Я не бачу сенсу в тому, що роблю щодня.","en":"I don't see the point in what I do every day.","r":0},{"ua":"Мені важко уявити, що за пів року стане краще.","en":"I find it hard to imagine things getting better in six months.","r":0},{"ua":"Я рідко відчуваю гордість за свої досягнення.","en":"I rarely feel proud of my achievements.","r":0},{"ua":"У мене є справи, від яких я щиро заряджаюсь.","en":"I have activities that truly energize me.","r":1}]}],"who":{"ua":["Самодопомоги зазвичай достатньо, якщо виснаження пов'язане з конкретним періодом (дедлайни, сесія, новий проєкт) і проходить після відпочинку.","Варто звернутись до психотерапевта чи лікаря, якщо стан триває місяцями, супроводжується безсонням, апатією, сильною тривогою чи думками, що «все марно». Вигорання не є окремим діагнозом, але схоже на депресію й потребує уваги. Це не діагноз, а орієнтир."],"en":["Self-help is usually enough if exhaustion is tied to a specific period (deadlines, exams, a new project) and passes after rest.","See a therapist or a doctor if the state lasts for months, comes with insomnia, apathy, strong anxiety or thoughts that “nothing matters.” Burnout isn't a separate diagnosis, but it resembles depression and deserves attention. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Батарейка на 1%: як відновитись і не вигоріти знову","d":"Готовий PDF-гайд по вигоранню: як відрізнити його від звичайної втоми, що робити першим тижнем і як вибудувати життя, де ресурс не закінчується. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Що таке вигорання і чим воно відрізняється від втоми","Шість вимірів вигорання та як вони проявляються","Перший тиждень: екстрені кроки, сон, межі, розмова з керівником","Як відновлюватись по-справжньому: звички та план на місяць","Коли це вже не вигорання, а привід звернутись по допомогу"],"bonus":["чекліст «Ранні ознаки вигорання»","шаблон розмови з керівником про навантаження"]},"en":{"t":"Battery at 1%: How to Recover and Not Burn Out Again","d":"A ready-made PDF guide to burnout: how to tell it from ordinary tiredness, what to do in the first week and how to build a life where the resource doesn't run out. No filler or motivational quotes. It lands in your inbox right after payment.","days":["What burnout is and how it differs from tiredness","Six dimensions of burnout and how they show up","The first week: emergency steps, sleep, boundaries, talking to your manager","How to truly recover: habits and a one-month plan","When it's no longer burnout but a reason to seek help"],"bonus":["“Early signs of burnout” checklist","Template for a workload talk with your manager"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль вигорання за 6 вимірами","profileNote":"Загальний відсоток є середнім. Профіль показує, де ресурс сідає найсильніше.","drivers":"Що зараз тебе виснажує","noDrv":"Жоден вимір не виділяється високо. Це гарний знак.","match":"Рівень вигорання","toLow":"заряд є","toHigh":"ресурс на нулі"},"en":{"profile":"Your burnout profile across 6 dimensions","profileNote":"The overall percentage is an average. The profile shows where your resource drains the most.","drivers":"What drains you right now","noDrv":"No dimension stands out as high. That's a good sign.","match":"Burnout level","toLow":"charged","toHigh":"resource at zero"}},"bands":[{"max":39,"id":"low","ua":{"h":"Батарейка тримається","p":["Ознак вигорання мало. Ти втомлюєшся, як і всі, але відновлюєшся: сон, відпочинок і радість поки працюють.","Це гарний момент, щоб закріпити те, що тебе рятує, і не відкладати відпочинок «на потім»."],"tr":["Запиши три речі, які найкраще тебе відновлюють, і поклади їх у календар на тиждень.","Не чекай втоми, щоб відпочивати: роби паузи заздалегідь.","Помічай ранні сигнали: дратівливість, поганий сон, «мені все одно»."],"bullets":[]},"en":{"h":"The Battery Holds","p":["There are few signs of burnout. You get tired like everyone, but you recover: sleep, rest and joy still work.","This is a good time to lock in what saves you and not postpone rest “for later.”"],"tr":["Write down the three things that restore you best and put them in your calendar for the week.","Don't wait for tiredness to rest: take breaks in advance.","Watch for early signals: irritability, poor sleep, “I don't care.”"],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Режим економії енергії","p":["Є помітні ознаки перевантаження. Ти ще тримаєшся, але вже платиш за це якістю сну, настрою чи концентрації. Це той етап, на якому ще легко повернутися без великих втрат.","Вигорання не приходить за ніч. Його можна зупинити саме зараз, поки воно схоже на «просто втому»."],"tr":["Прибери з тижня одну справу, яку можна не робити, і запиши, що змінилось.","Встанови час, після якого не відповідаєш на робочі повідомлення.","Поговори з кимось про своє навантаження: вголос воно виглядає керованішим."],"bullets":[]},"en":{"h":"Power-Saving Mode","p":["There are noticeable signs of overload. You're still holding on but already paying with sleep, mood or concentration. This is the stage where it's still easy to come back without big losses.","Burnout doesn't arrive overnight. You can stop it right now, while it still looks like “just tiredness.”"],"tr":["Remove one task from your week that you can skip, and note what changed.","Set a time after which you don't answer work messages.","Talk to someone about your load: out loud it looks more manageable."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Червона зона","p":["Твої відповіді показують сильне виснаження з кількома тривожними ознаками: цинізм, втрату радості, порушення сну. Це не вирок «ти слабкий(-а)», а чесний сигнал, що ресурс на нулі.","Тут уже недостатньо «потерпіти до відпустки». Потрібні зміни в навантаженні й, найімовірніше, підтримка від людини, яка допоможе зорієнтуватись."],"tr":["Сьогодні скажи одній людині: «Мені зараз дуже важко». Це перший крок.","Зменш навантаження на 30% хоча б на два тижні: переговори, перенесення термінів.","Розглянь консультацію з психотерапевтом чи лікарем, особливо якщо є проблеми зі сном чи апетитом."],"bullets":[]},"en":{"h":"The Red Zone","p":["Your answers show strong exhaustion with several alarming signs: cynicism, loss of joy, disrupted sleep. This isn't a “you're weak” signal but an honest sign that your resource is at zero.","“Hanging on until vacation” is no longer enough. You need changes in workload and most likely support from someone who can help you find your bearings."],"tr":["Today tell one person: “I'm really struggling right now.” That's the first step.","Cut your load by 30% for at least two weeks: negotiate, move deadlines.","Consider a consultation with a therapist or a doctor, especially if you have trouble with sleep or appetite."],"bullets":[]}}]},{"id":"anxiety","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Постійне прокручування думок","why":"Мозок шукає загрози навіть там, де їх немає: «а що, як…». Це спроба захистити тебе, яка перетворилась на фоновий шум.","act":"Дай тривозі «вікно»: 15 хвилин на день, коли ти свідомо думаєш про турботи. Поза вікном відкладай: «подумаю о 18:00»."},"en":{"n":"Constant worrying","why":"The brain hunts for threats even where there are none: “what if…”. It's an attempt to protect you that turned into background noise.","act":"Give worry a “window”: 15 minutes a day when you deliberately think about your concerns. Outside the window postpone: “I'll think about it at 6 pm.”"},"items":[{"ua":"Мені важко зупинити думки про те, що може піти не так.","en":"I find it hard to stop thinking about what could go wrong.","r":0},{"ua":"Я прокручую в голові розмови, які вже відбулись.","en":"I replay conversations that already happened.","r":0},{"ua":"Я хвилююсь про речі, на які я не можу вплинути.","en":"I worry about things I can't influence.","r":0},{"ua":"Навіть коли все добре, я чекаю, що зараз щось станеться.","en":"Even when everything's fine I wait for something to happen.","r":0},{"ua":"Я вмію «відпустити» думку й перемкнутись.","en":"I'm able to “let go” of a thought and switch to something else.","r":1}]},{"ua":{"n":"Тілесна напруга","why":"Тривога живе не лише в голові. Серцебиття, стиснуті м'язи, ком у горлі це нормальна реакція тіла «бий або тікай», що спрацьовує без реальної загрози.","act":"Спробуй дихання 4-6: вдих на 4 секунди, видих на 6, 2 хвилини. Довгий видих заспокоює нервову систему."},"en":{"n":"Body tension","why":"Anxiety doesn't live only in the head. A racing heart, tight muscles, a lump in the throat are a normal “fight or flight” response firing without a real threat.","act":"Try 4-6 breathing: inhale for 4 seconds, exhale for 6, for 2 minutes. A long exhale calms the nervous system."},"items":[{"ua":"Коли я хвилююсь, у мене прискорюється серцебиття чи пітніють долоні.","en":"When I'm nervous my heart races or my palms sweat.","r":0},{"ua":"Я часто відчуваю напругу в шиї, плечах чи щелепах.","en":"I often feel tension in my neck, shoulders or jaw.","r":0},{"ua":"Іноді в мене болить живіт чи нудить через переживання.","en":"Sometimes my stomach hurts or I feel nauseous from worry.","r":0},{"ua":"Мені буває важко глибоко вдихнути, коли я напружений(-а).","en":"It's sometimes hard to take a deep breath when I'm tense.","r":0},{"ua":"Моє тіло зазвичай розслаблене, навіть у складні періоди.","en":"My body is usually relaxed, even in hard periods.","r":1}]},{"ua":{"n":"Катастрофізація","why":"Мозок швидко добудовує найгірший сценарій і подає його як факт. Це когнітивне спотворення, і його можна навчитись помічати.","act":"Коли накриває, запитай: «Яка ймовірність цього насправді? Що я скажу другові в такій ситуації?»"},"en":{"n":"Catastrophizing","why":"The brain quickly builds the worst-case scenario and presents it as fact. It's a cognitive distortion, and you can learn to notice it.","act":"When it hits, ask: “How likely is this really? What would I tell a friend in this situation?”"},"items":[{"ua":"Дрібна проблема швидко перетворюється в моїй голові на катастрофу.","en":"A small problem quickly turns into a catastrophe in my head.","r":0},{"ua":"Якщо хтось не відповідає, я думаю, що сталось щось погане чи я щось зробив(-ла) не так.","en":"If someone doesn't reply I think something bad happened or I did something wrong.","r":0},{"ua":"Я часто думаю «це точно закінчиться погано».","en":"I often think “this will definitely end badly.”","r":0},{"ua":"Перед важливими подіями я уявляю найгірший варіант.","en":"Before important events I imagine the worst case.","r":0},{"ua":"Я зазвичай реально оцінюю ризики, а не лякаю себе.","en":"I usually assess risks realistically instead of scaring myself.","r":1}]},{"ua":{"n":"Уникання","why":"Уникання дає миттєве полегшення, але закріплює страх: мозок вчиться, що без втечі було б небезпечно.","act":"Обери одну малу справу, яку ти відкладаєш через тривогу, і зроби її сьогодні на 5 хвилин. Лише 5."},"en":{"n":"Avoidance","why":"Avoidance brings instant relief but strengthens the fear: the brain learns it would have been dangerous without escape.","act":"Pick one small thing you've been putting off because of anxiety and do it today for 5 minutes. Just 5."},"items":[{"ua":"Я відкладаю телефонні дзвінки чи листи, які мене лякають.","en":"I put off phone calls or emails that scare me.","r":0},{"ua":"Я іноді відмовляюсь від планів, бо не впевнений(-а), що впораюсь.","en":"I sometimes cancel plans because I'm not sure I'll cope.","r":0},{"ua":"Я обираю знайомі й безпечні варіанти, щоб не хвилюватись.","en":"I choose familiar, safe options to avoid worrying.","r":0},{"ua":"Я уникаю ситуацій, де можу виглядати невпевнено.","en":"I avoid situations where I may look unsure.","r":0},{"ua":"Я можу робити те, що лякає, навіть якщо хвилююсь.","en":"I can do things that scare me even if I'm nervous.","r":1}]},{"ua":{"n":"Сон і тривога","why":"Тривога й сон тісно пов'язані: недосип підвищує тривожність, а тривога заважає спати. Розірвати цей цикл можна з обох кінців.","act":"Перед сном запиши на папері всі «відкриті» думки й справи, а потім скажи собі: «Це завтра». Мозку легше відпустити."},"en":{"n":"Sleep and anxiety","why":"Anxiety and sleep are closely linked: lack of sleep raises anxiety, and anxiety disrupts sleep. You can break the cycle from either end.","act":"Before bed write on paper all the “open” thoughts and tasks, then tell yourself: “That's for tomorrow.” It's easier for the brain to let go."},"items":[{"ua":"Увечері тривожні думки стають гучнішими.","en":"In the evening anxious thoughts get louder.","r":0},{"ua":"Мені складно заснути через переживання.","en":"I find it hard to fall asleep because of worry.","r":0},{"ua":"Я прокидаюсь рано з відчуттям тривоги.","en":"I wake up early with a feeling of anxiety.","r":0},{"ua":"Мій сон поверхневий, я часто прокидаюсь.","en":"My sleep is shallow and I wake often.","r":0},{"ua":"Я засинаю без зусиль, щойно лягаю.","en":"I fall asleep effortlessly as soon as I lie down.","r":1}]},{"ua":{"n":"Потреба в запевненнях і контролі","why":"Постійні перевірки й запитання «усе ж добре?» дають тимчасове полегшення, але тримають тривогу живою.","act":"Коли тягне перепитати чи перевірити, зачекай 10 хвилин. Тривога піде вгору, а потім сама почне спадати."},"en":{"n":"Need for reassurance and control","why":"Constant checking and asking “is everything okay?” bring temporary relief but keep the anxiety alive.","act":"When you feel pulled to ask again or check, wait 10 minutes. The anxiety will rise and then start to fall on its own."},"items":[{"ua":"Я часто питаю близьких, чи все гаразд, чи не образились вони.","en":"I often ask people close to me whether everything's okay or if they're upset.","r":0},{"ua":"Я перевіряю по кілька разів: двері, повідомлення, терміни.","en":"I check several times: doors, messages, deadlines.","r":0},{"ua":"Мені потрібно знати наперед, що буде, щоб бути спокійним(-ою).","en":"I need to know in advance what will happen in order to feel calm.","r":0},{"ua":"Я гуглю симптоми чи ситуації, поки не стане ще страшніше.","en":"I google symptoms or situations until it gets even scarier.","r":0},{"ua":"Я можу жити з невизначеністю, не шукаючи гарантій.","en":"I can live with uncertainty without looking for guarantees.","r":1}]}],"who":{"ua":["Самодопомоги зазвичай достатньо, якщо тривога пов'язана з конкретними подіями й минає, коли вони закінчуються.","Варто звернутись до психотерапевта чи лікаря, якщо тривога триває тижнями, з'являються панічні атаки, сильне уникання, безсоння чи страх, що заважає навчанню, роботі й стосункам. Добре працює <b>КПТ<\/b> (когнітивно-поведінкова терапія) та терапія прийняття й відповідальності. Якщо виникає гостре відчуття небезпеки чи думки про самоушкодження, одразу звернись по допомогу до екстрених служб чи лінії підтримки. Це не діагноз, а орієнтир."],"en":["Self-help is usually enough if anxiety is tied to specific events and fades when they end.","See a therapist or a doctor if anxiety lasts for weeks, there are panic attacks, strong avoidance, insomnia or fear that gets in the way of study, work and relationships. <b>CBT<\/b> (cognitive behavioral therapy) and acceptance and commitment therapy work well. If you feel in acute danger or have thoughts of self-harm, contact emergency services or a helpline right away. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Мозок без трилерів: як вимкнути тривогу, коли вона вже зайшла надто далеко","d":"Готовий PDF-гайд по тривожності: як працює тривога, що робити в моменті й як зменшувати її на довгій дистанції. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Що таке тривога і навіщо вона мозку","Шість вимірів тривожності та як їх розпізнати","Швидка допомога: дихання, заземлення, правила для панічної хвилі","Довга дистанція: вікно турбот, експозиції, сон і звички","Коли самодопомоги мало і як шукати терапевта"],"bonus":["карта «Тривожні думки → реальність»","план заземлення на 5 хвилин"]},"en":{"t":"A Brain Without Thrillers: Turning Anxiety Down When It Has Gone Too Far","d":"A ready-made PDF guide to anxiety: how it works, what to do in the moment and how to reduce it over the long run. No filler or motivational quotes. It lands in your inbox right after payment.","days":["What anxiety is and why the brain makes it","Six dimensions of anxiety and how to recognize them","First aid: breathing, grounding, rules for a panic wave","The long run: worry window, exposure, sleep and habits","When self-help is not enough and how to find a therapist"],"bonus":["“Anxious thoughts → reality” map","5-minute grounding plan"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль тривожності за 6 вимірами","profileNote":"Загальний відсоток є середнім. Профіль показує, звідки найбільше йде напруга.","drivers":"Що зараз підживлює тривогу","noDrv":"Жоден вимір не виділяється високо. Це гарний знак.","match":"Рівень тривожності","toLow":"спокійно","toHigh":"дуже напружено"},"en":{"profile":"Your anxiety profile across 6 dimensions","profileNote":"The overall percentage is an average. The profile shows where the tension comes from the most.","drivers":"What feeds the anxiety right now","noDrv":"No dimension stands out as high. That's a good sign.","match":"Anxiety level","toLow":"calm","toHigh":"very tense"}},"bands":[{"max":39,"id":"low","ua":{"h":"Спокійне море","p":["Рівень тривожності в тебе помірний і природний. Тривога іноді приходить, але не керує днем. Це здорова реакція на життя.","Тривога корисна: вона допомагає готуватись і дбати про себе. Головне, що ти вмієш повертатись у спокій."],"tr":["Закріпи те, що тебе заспокоює: прогулянка, музика, дихання.","Не ігноруй ранні сигнали стресу: сон, апетит, дратівливість.","Іноді проговорюй турботи вголос, поки вони ще малі."],"bullets":[]},"en":{"h":"Calm Sea","p":["Your anxiety level is moderate and natural. Anxiety visits sometimes but doesn't run your day. That's a healthy response to life.","Anxiety is useful: it helps you prepare and take care of yourself. The main thing is that you know how to come back to calm."],"tr":["Anchor what calms you: a walk, music, breathing.","Don't ignore early stress signals: sleep, appetite, irritability.","Say your worries out loud now and then while they're still small."],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Мозок дивиться трилери","p":["У тебе помітна тривожність: думки крутяться, тіло напружується, а деякі речі ти починаєш уникати. Це дуже поширений стан, і він добре піддається самодопомозі.","Мозок вважає, що турбота це робота. Завдання не змусити його замовкнути, а навчити розрізняти справжню загрозу й фоновий шум."],"tr":["Спробуй «вікно турбот»: 15 хвилин на день для тривожних думок, решту часу відкладай.","Дихання 4-6 по 2 хвилини двічі на день, не лише в паніці.","Зроби одну малу справу, яку ти уникаєш, і помічай, що вона не була такою страшною."],"bullets":[]},"en":{"h":"The Brain Is Binge-Watching Thrillers","p":["Your anxiety is noticeable: thoughts spin, your body tenses and you start avoiding some things. It's a very common state and responds well to self-help.","The brain thinks worrying is a job. The task isn't to silence it but to teach it to tell a real threat from background noise."],"tr":["Try a “worry window”: 15 minutes a day for anxious thoughts, postpone the rest of the time.","4-6 breathing for 2 minutes twice a day, not only in panic.","Do one small thing you avoid and notice it wasn't as scary as expected."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Тривога за кермом","p":["Твої відповіді показують високий рівень тривожності, яка вже помітно впливає на сон, тіло й вибір. Це не слабкість і не «характер», це стан, з яким можна працювати.","Самодопомога тут корисна, але зазвичай найкраще працює у зв'язці з підтримкою спеціаліста: тривожні розлади добре лікуються."],"tr":["Розглянь консультацію з психотерапевтом чи лікарем, особливо якщо тривога триває понад кілька тижнів.","Поділись із однією близькою людиною: ізоляція підсилює тривогу.","Тримайся простих основ: сон, їжа, рух, менше кофеїну."],"bullets":[]},"en":{"h":"Anxiety in the Driver's Seat","p":["Your answers show a high level of anxiety that already noticeably affects your sleep, body and choices. It isn't weakness or “character,” it's a state you can work with.","Self-help is useful here but usually works best together with a professional: anxiety disorders respond well to treatment."],"tr":["Consider a consultation with a therapist or a doctor, especially if the anxiety has lasted over a few weeks.","Share with one person close to you: isolation amplifies anxiety.","Stick to simple basics: sleep, food, movement, less caffeine."],"bullets":[]}}]},{"id":"attach","kind":"grid","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Страх покинутості","why":"","act":""},"en":{"n":"Fear of abandonment","why":"","act":""},"items":[{"ua":"Я переживаю, що близька людина може мене залишити.","en":"I worry that someone close may leave me.","r":0},{"ua":"Коли партнер чи друг віддаляється, я одразу думаю, що зробив(-ла) щось не так.","en":"When a partner or friend pulls away I immediately think I did something wrong.","r":0},{"ua":"Тиша від близької людини викликає в мене тривогу.","en":"Silence from someone close makes me anxious.","r":0},{"ua":"Я боюсь, що в стосунках мене люблять менше, ніж я люблю.","en":"I'm afraid I'm loved less in relationships than I love.","r":0},{"ua":"Мені важко повірити, що мене можна любити без умов.","en":"It's hard for me to believe I can be loved unconditionally.","r":0}]},{"ua":{"n":"Потреба в запевненнях","why":"","act":""},"en":{"n":"Need for reassurance","why":"","act":""},"items":[{"ua":"Мені потрібно часто чути, що я важливий(-а) для людини.","en":"I need to hear often that I matter to the person.","r":0},{"ua":"Я перечитую повідомлення, шукаючи прихований сенс.","en":"I reread messages looking for hidden meaning.","r":0},{"ua":"Мені складно, якщо людина довго не пише чи не дзвонить.","en":"It's hard when someone doesn't text or call for a long time.","r":0},{"ua":"Після сварки мені потрібно якнайшвидше помиритись, інакше я не можу думати про інше.","en":"After a fight I need to make up as soon as possible or I can't think about anything else.","r":0},{"ua":"Мені важливо, щоб близька людина показувала свої почуття часто й помітно.","en":"I want someone close to show their feelings often and visibly.","r":0}]},{"ua":{"n":"Ревнощі і перевірка","why":"","act":""},"en":{"n":"Jealousy and checking","why":"","act":""},"items":[{"ua":"Я помічаю, з ким близька людина спілкується, і це мене турбує.","en":"I notice who my close person talks to, and it worries me.","r":0},{"ua":"Іноді я перевіряю, коли людина була в мережі чи що вона робить.","en":"Sometimes I check when someone was online or what they're doing.","r":0},{"ua":"Мені буває важко не порівнювати себе з іншими людьми в житті партнера.","en":"I sometimes find it hard not to compare myself with other people in my partner's life.","r":0},{"ua":"Я легко відчуваю себе зайвим(-ою), коли поруч інші близькі люди.","en":"I easily feel like a third wheel when other close people are around.","r":0},{"ua":"Коли я нервую, я можу «влаштувати перевірку» словами чи поведінкою.","en":"When I'm nervous I may “test” someone with words or behavior.","r":0}]},{"ua":{"n":"Дискомфорт від близькості","why":"","act":""},"en":{"n":"Discomfort with closeness","why":"","act":""},"items":[{"ua":"Коли хтось наближається надто сильно, мені хочеться відступити.","en":"When someone gets too close, I want to back away.","r":0},{"ua":"Мені некомфортно, коли хтось залежить від мене емоційно.","en":"I'm uncomfortable when someone depends on me emotionally.","r":0},{"ua":"Я швидко охолоджуюсь, коли стосунки стають серйознішими.","en":"I cool off quickly when a relationship gets more serious.","r":0},{"ua":"Часті обійми й близькість для мене швидко стають забагато.","en":"Frequent hugs and closeness quickly become too much for me.","r":0},{"ua":"Я іноді шукаю недоліки в людині, щоб знайти привід відсторонитись.","en":"I sometimes look for flaws in a person to find a reason to pull away.","r":0}]},{"ua":{"n":"Самодостатність як захист","why":"","act":""},"en":{"n":"Self-reliance as protection","why":"","act":""},"items":[{"ua":"Я вважаю, що можна розраховувати тільки на себе.","en":"I believe I can only rely on myself.","r":0},{"ua":"Мені легше вирішити проблему самому(-ій), ніж просити допомоги.","en":"It's easier to solve a problem alone than to ask for help.","r":0},{"ua":"Я не люблю виглядати слабким(-ою) перед іншими.","en":"I don't like looking weak in front of others.","r":0},{"ua":"Я ціную незалежність більше, ніж близькість.","en":"I value independence more than closeness.","r":0},{"ua":"Мені некомфортно, коли хтось намагається мені допомогти без запиту.","en":"I'm uncomfortable when someone tries to help me without being asked.","r":0}]},{"ua":{"n":"Емоційна закритість","why":"","act":""},"en":{"n":"Emotional closedness","why":"","act":""},"items":[{"ua":"Я рідко ділюсь своїми глибокими почуттями.","en":"I rarely share my deep feelings.","r":0},{"ua":"Мені складно підібрати слова, коли мене питають, що я відчуваю.","en":"I find it hard to find words when asked what I feel.","r":0},{"ua":"Я можу «вимкнути» емоції, коли розмова стає надто особистою.","en":"I can “switch off” emotions when a conversation gets too personal.","r":0},{"ua":"Мені легше жартувати чи змінити тему, ніж говорити про серйозне.","en":"It's easier to joke or change the subject than to talk about serious things.","r":0},{"ua":"Іноді люди кажуть, що не розуміють, що я насправді відчуваю.","en":"Sometimes people say they don't understand what I really feel.","r":0}]}],"who":{"ua":["Стиль прив'язаності не вирок і не діагноз. Він не фіксований: з досвідом, безпечними стосунками й усвідомленістю його можна змінювати.","Варто звернутись до психотерапевта, якщо ти постійно потрапляєш в один і той самий болючий сценарій у стосунках, відчуваєш сильну тривогу чи самотність у близькості. Добре працює терапія, зосереджена на прив'язаності, і схема-терапія. Це не діагноз, а орієнтир."],"en":["An attachment style is not a verdict or a diagnosis. It isn't fixed: with experience, safe relationships and awareness it can change.","Consider a therapist if you keep landing in the same painful pattern in relationships or feel strong anxiety or loneliness within closeness. Attachment-focused therapy and schema therapy work well. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Якір, кулька чи кіт: як будувати стосунки зі своїм типом прив'язаності","d":"Готовий PDF-гайд по прив'язаності: як працює твій тип, що запускає тривогу чи дистанцію і як рухатись до безпечніших стосунків. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Теорія прив'язаності простими словами","Чотири типи та як вони поєднуються між собою","Що запускає тривогу чи дистанцію і що з цим робити","Вправи й скрипти для розмов про потреби","Коли варто піти до терапевта і як це зробити"],"bonus":["чекліст «Що мені потрібно від стосунків»","шаблон розмови «Мені потрібен простір»"]},"en":{"t":"Anchor, Balloon or Cat: Building Rela
