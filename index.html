tionships With Your Attachment Style","d":"A ready-made PDF guide to attachment: how your type works, what triggers anxiety or distance and how to move toward safer relationships. No filler or motivational quotes. It lands in your inbox right after payment.","days":["Attachment theory in plain words","Four types and how they pair with each other","What triggers anxiety or distance and what to do about it","Exercises and scripts for talking about needs","When to see a therapist and how to go about it"],"bonus":["“What I need from relationships” checklist","“I need some space” conversation template"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твої шість ліній прив'язаності","profileNote":"Перші три лінії про тривогу в стосунках, останні три про дистанцію. Їхнє поєднання визначає твій тип."},"en":{"profile":"Your six attachment lines","profileNote":"The first three lines are about anxiety in relationships, the last three about distance. Their mix defines your type."}},"types":{"ll":{"ua":{"name":"Якір","h":"Твій тип: Якір, надійна прив'язаність","p":["Ти в цілому спокійно ставишся до близькості: можеш і довіряти, і залишатись собою. Сварки не ставлять під сумнів стосунки, і ти вмієш просити підтримки без драми.","Це не означає, що в тебе ідеальне життя. Просто твій мозок у близькості переважно відчуває безпеку, а не загрозу, і це дуже цінний ресурс і для тебе, і для партнерів."],"tr":["Продовжуй говорити про потреби прямо, це твоя сильна сторона.","Підтримуй друзів чи партнерів, які мають тривожний чи холодний стиль: твоя стабільність їм допомагає.","Не ігноруй себе, коли даєш підтримку: межі теж частина надійності."],"bullets":[]},"en":{"name":"Anchor","h":"Your type: The Anchor, secure attachment","p":["You're mostly calm about closeness: you can both trust and stay yourself. Fights don't put the relationship in question, and you can ask for support without drama.","It doesn't mean your life is perfect. Your brain simply feels safety in closeness more than threat, and that's a very valuable resource for you and your partners."],"tr":["Keep saying your needs directly, it's your strength.","Support friends or partners with an anxious or cold style: your stability helps them.","Don't ignore yourself while supporting others: boundaries are part of reliability too."],"bullets":[]}},"hl":{"ua":{"name":"Повітряна кулька","h":"Твій тип: Повітряна кулька, тривожна прив'язаність","p":["Ти прагнеш близькості й дуже тонко відчуваєш найменші зміни в людях поруч. Ззовні це часто виглядає як теплота й залученість, а всередині працює тривожний радар: «чи все добре між нами?».","Це не «слабкість» і не «драматизм». Це навичка, що колись допомагала тримати зв'язок із важливими людьми. Тепер вона вмикається надто часто, і її можна налаштувати."],"tr":["Коли тягне перепитати «усе добре?», зачекай 10 хвилин і спробуй заспокоїти себе сам(-а).","Говори про потребу прямо: «Мені важливо чути від тебе…», а не через натяки.","Збудуй більше опор: друзі, заняття, хобі, щоб не все трималось на одній людині."],"bullets":[]},"en":{"name":"Balloon","h":"Your type: The Balloon, anxious attachment","p":["You crave closeness and sense the smallest changes in the people near you. Outwardly it often looks like warmth and involvement, while inside an anxious radar runs: “are we okay?”","It isn't “weakness” or “drama.” It's a skill that once helped keep the bond with important people. Now it switches on too often, and it can be tuned."],"tr":["When you feel pulled to ask “are we okay?”, wait 10 minutes and try to soothe yourself first.","Say the need directly: “It matters to me to hear from you…”, not through hints.","Build more supports: friends, activities, hobbies, so everything doesn't rest on one person."],"bullets":[]}},"lh":{"ua":{"name":"Дикий кіт","h":"Твій тип: Дикий кіт, уникаюча прив'язаність","p":["Ти цінуєш свободу, власний простір і вміння покладатись на себе. Близькість приваблює, але швидко починає здаватись «забагато», і тоді хочеться відступити.","Це не байдужість. Скоріше, це захист, який колись спрацював: якщо не залежати від інших, ніхто не розчарує. Тепер варто дозволяти собі підпускати людей трохи ближче."],"tr":["Наступного разу, коли захочеш відступити, скажи: «Мені потрібен час, я повернусь». Це не те саме, що зникнути.","Раз на тиждень поділись із кимось однією справжньою думкою чи відчуттям.","Проси про маленьку допомогу, щоб тренувати довіру."],"bullets":[]},"en":{"name":"Feral Cat","h":"Your type: The Feral Cat, avoidant attachment","p":["You value freedom, your own space and self-reliance. Closeness attracts you but quickly starts to feel like “too much,” and then you want to retreat.","It isn't indifference. It's more a protection that once worked: if you don't depend on others, nobody can let you down. Now it's worth letting people a bit closer."],"tr":["Next time you want to pull away, say: “I need some time, I'll be back.” That's not the same as disappearing.","Once a week share one real thought or feeling with someone.","Ask for a small favor to practice trust."],"bullets":[]}},"hh":{"ua":{"name":"Їжак","h":"Твій тип: Їжак, тривожно-уникаюча прив'язаність","p":["Ти хочеш близькості й водночас боїшся її. Підходиш, потім відстороняєшся, потім скучаєш, і цей ритм виснажує і тебе, і людей поруч. Усередині ніби два голоси: «не залишай мене» і «не підходь».","Це дуже людська стратегія, яка часто формується, коли близькі люди були джерелом і тепла, і напруги. З ним можна працювати, і найкраще це робиться повільно й у безпечних стосунках."],"tr":["Помічай, який «голос» зараз говорить: тривожний чи захисний. Просто назви його.","Повідомляй людям про свій ритм: «Мені іноді потрібен простір, але це не про тебе».","Розглянь роботу з терапевтом, особливо з досвідом у прив'язаності чи схема-терапії."],"bullets":[]},"en":{"name":"Hedgehog","h":"Your type: The Hedgehog, fearful-avoidant attachment","p":["You want closeness and fear it at the same time. You approach, then withdraw, then miss them, and this rhythm exhausts you and the people near you. Inside there are two voices: “don't leave me” and “don't come close.”","It's a deeply human strategy that often forms when close people were a source of both warmth and tension. It can be worked with, best slowly and in safe relationships."],"tr":["Notice which “voice” is speaking now: the anxious or the protective one. Just name it.","Tell people about your rhythm: “I sometimes need space, but it isn't about you.”","Consider working with a therapist, especially one experienced in attachment or schema therapy."],"bullets":[]}}},"axes":[[0,1,2],[3,4,5]],"axn":{"ua":["Тривога","Дистанція"],"en":["Anxiety","Distance"]}},{"id":"main","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Життя як сюжет","why":"Люди з сильним внутрішнім наративом бачать у своєму житті арку: початок, злами, ціль. Це дає сенс, але іноді й змушує драматизувати звичайні дні.","act":"Запиши свою історію за останній рік у трьох реченнях. Потім перепиши її з погляду близької людини й подивись, що змінилось."},"en":{"n":"Life as a story","why":"People with a strong inner narrative see an arc in their life: beginning, turning points, a goal. It gives meaning, but it can also make ordinary days feel over-dramatized.","act":"Write your last year in three sentences. Then rewrite it from a close person's point of view and see what changes."},"items":[{"ua":"Я часто уявляю своє життя як фільм чи серіал.","en":"I often imagine my life as a film or a series.","r":0},{"ua":"Я дивлюсь на події в житті як на «сцени», які щось означають для мого сюжету.","en":"I look at life events as “scenes” that mean something for my plot.","r":0},{"ua":"Коли відбувається щось важливе, у голові грає «саундтрек».","en":"When something important happens, a “soundtrack” plays in my head.","r":0},{"ua":"Я думаю про те, яким мене запам'ятають.","en":"I think about how I'll be remembered.","r":0},{"ua":"Моє життя здається мені просто набором справ без сюжету.","en":"My life feels like just a list of tasks with no plot.","r":1}]},{"ua":{"n":"Відчуття прожектора","why":"Прожектор в голові змушує думати, що всі за тобою спостерігають. Насправді люди зайняті власним прожектором, і це хороша новина.","act":"Наступного разу, коли відчуєш, що на тебе дивляться, запитай себе: «А про що я сам(-а) думаю, коли бачу незнайомця?»"},"en":{"n":"The spotlight feeling","why":"The spotlight in your head makes you think everyone is watching you. In reality people are busy with their own spotlight, and that's good news.","act":"Next time you feel watched, ask yourself: “What do I think about when I see a stranger?”"},"items":[{"ua":"Я часто відчуваю, що інші помічають мої дрібні помилки чи недоліки.","en":"I often feel others notice my small mistakes or flaws.","r":0},{"ua":"Заходячи в кімнату, я помічаю, як на мене реагують.","en":"When I walk into a room I notice how people react to me.","r":0},{"ua":"Після розмови я довго прокручую, що про мене могли подумати.","en":"After a conversation I replay for a long time what they might have thought of me.","r":0},{"ua":"Мені здається, що мою поведінку обговорюють частіше, ніж це відбувається насправді.","en":"It seems to me my behavior is discussed more often than it really is.","r":0},{"ua":"Я легко почуваюсь непомітним(-ою) серед людей і мені це комфортно.","en":"I easily feel unnoticed among people and I'm comfortable with it.","r":1}]},{"ua":{"n":"Потреба в увазі","why":"Бажання бути в центрі це нормальна людська потреба в баченні. Проблеми починаються, коли тільки чужа увага підтверджує, що ти існуєш.","act":"Один день проведи без публікацій і відповідей на реакції. Подивись, що ти відчуваєш і від чого це залежить."},"en":{"n":"Need for attention","why":"Wanting to be at the center is a normal human need to be seen. Problems begin when only others' attention confirms that you exist.","act":"Spend one day without posting or checking reactions. Notice what you feel and what it depends on."},"items":[{"ua":"Мені приємно, коли розмова крутиться навколо мене.","en":"I enjoy it when the conversation revolves around me.","r":0},{"ua":"Я перевіряю лайки, перегляди чи реакції на свої публікації.","en":"I check likes, views or reactions to my posts.","r":0},{"ua":"Коли мене довго не помічають, мені стає не по собі.","en":"When I'm not noticed for a long time, I feel uneasy.","r":0},{"ua":"Я вмію так розповісти історію, щоб усі слухали саме мене.","en":"I know how to tell a story so everyone listens to me.","r":0},{"ua":"Мені цілком достатньо, якщо мою роботу цінують тільки я і ще пара людей.","en":"It's enough for me if only I and a couple of others value my work.","r":1}]},{"ua":{"n":"Роль лідера","why":"Це про дієвість: ти береш керування над власним життям і подіями. Здорова версія це відповідальність, перегин це контроль над усім.","act":"Обери одну справу цього тижня й передай її комусь, не контролюючи процес. Подивись, що станеться."},"en":{"n":"Lead role","why":"This is about agency: you take the wheel of your own life and events. The healthy version is responsibility, the excess is controlling everything.","act":"Pick one task this week and hand it to someone without controlling the process. See what happens."},"items":[{"ua":"Я зазвичай беру ініціативу, коли група не знає, що робити.","en":"I usually take the initiative when a group doesn't know what to do.","r":0},{"ua":"Мені важко працювати, коли хтось інший вирішує за мене.","en":"I find it hard to work when someone else decides for me.","r":0},{"ua":"Я вірю, що мої рішення суттєво впливають на мою долю.","en":"I believe my decisions strongly shape my fate.","r":0},{"ua":"Мені складно уявити себе у ролі «другого плану».","en":"It's hard for me to picture myself in a supporting role.","r":0},{"ua":"Я охоче віддаю лідерство іншим і не відчуваю дискомфорту.","en":"I'm happy to hand over leadership and feel no discomfort.","r":1}]},{"ua":{"n":"Романтизація життя","why":"Це про вміння бачити красу й значення в дрібницях: кава, дощ, поїздка в метро. Це дар, поки він не підміняє реальні дії мріями.","act":"Додай до дня одну маленьку «сцену» з реальною дією: напиши листа, зателефонуй, зроби крок до мети."},"en":{"n":"Romanticizing life","why":"This is the knack of seeing beauty and meaning in small things: coffee, rain, a metro ride. It's a gift until it replaces action with daydreams.","act":"Add one small “scene” with a real action to your day: write a letter, make a call, take a step toward a goal."},"items":[{"ua":"Я навмисно створюю «естетичні» моменти, щоб запам'ятати їх.","en":"I deliberately create “aesthetic” moments to remember them.","r":0},{"ua":"Мені подобається вигадувати, що буде, коли «моє життя нарешті налагодиться».","en":"I like imagining what will happen when “my life finally comes together.”","r":0},{"ua":"Я надаю символічного значення випадковим подіям і знакам.","en":"I give symbolic meaning to random events and signs.","r":0},{"ua":"Іноді мені важче жити у звичайному дні, ніж у власних уявленнях.","en":"Sometimes ordinary days are harder for me than my own imaginings.","r":0},{"ua":"Я рідко звертаю увагу на красу дрібниць.","en":"I rarely pay attention to the beauty of small things.","r":1}]},{"ua":{"n":"Інші як другий план","why":"Цей вимір чесний і найнезручніший: наскільки в твоїх розповідях присутні інші люди як самостійні герої, а не декорації для твого сюжету.","act":"У наступній розмові поставте три питання про людину й жодного про себе. Подивись, що ти дізнаєшся."},"en":{"n":"Others as supporting cast","why":"This dimension is honest and the most uncomfortable: how present are other people in your stories as heroes in their own right, not scenery for your plot.","act":"In your next conversation ask three questions about the other person and none about yourself. See what you learn."},"items":[{"ua":"Мені буває нудно слухати чужі історії, якщо вони не мають до мене стосунку.","en":"I sometimes get bored listening to others' stories if they don't relate to me.","r":0},{"ua":"Мені важко згадати дрібниці з життя друзів, якщо вони не стосуються мене.","en":"I find it hard to recall details of my friends' lives unless they involve me.","r":0},{"ua":"Я іноді оцінюю людей за тим, чи вони «корисні» для моїх планів.","en":"I sometimes judge people by whether they are “useful” for my plans.","r":0},{"ua":"Мені кажуть, що я забагато говорю про себе.","en":"People tell me I talk about myself too much.","r":0},{"ua":"Я щиро радію успіхам інших, навіть якщо вони випередили мене.","en":"I sincerely celebrate others' success even if they got ahead of me.","r":1}]}],"who":{"ua":["Це не діагноз і не «синдром» у клінічному сенсі. Назва жартівлива, а сам тест про те, наскільки ти бачиш себе в центрі власної історії й чи залишається місце для інших.","Варто звернутись до психотерапевта, якщо потреба в увазі й схвалення починає руйнувати стосунки, або навпаки, якщо ти постійно почуваєшся невидимим(-ою) і неважливим(-ою). Це не діагноз, а орієнтир."],"en":["This isn't a diagnosis or a “syndrome” in the clinical sense. The name is playful; the test is about how much you see yourself at the center of your own story and whether there's room for others.","Consider a therapist if the need for attention and approval starts to wreck your relationships, or conversely if you constantly feel invisible and unimportant. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Головний герой без драми: як бути автором, а не заручником сюжету","d":"Готовий PDF-гайд про синдром головного героя: де він дає силу, а де шкодить стосункам, як бути автором свого життя й не робити з інших декорації. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Що таке «головний герой» у психології: наратив, увага, дієвість","Шість вимірів і як вони проявляються в житті й соцмережах","Баланс: як бути в центрі й не втрачати людей","Практики: уважність до інших, робота зі схваленням, реальні кроки замість мрій","Коли варто звернутись по підтримку"],"bonus":["чекліст «Мій сюжет і мої люди»","вправа «Тиждень без публіки»"]},"en":{"t":"Main Character Without the Drama: Be the Author, Not a Hostage of the Plot","d":"A ready-made PDF guide to the main character syndrome: where it gives strength and where it harms relationships, how to be the author of your life without turning others into scenery. No filler or motivational quotes. It lands in your inbox right after payment.","days":["What “main character” means in psychology: narrative, attention, agency","Six dimensions and how they show in life and social media","Balance: be at the center without losing people","Practices: attention to others, working with approval, real steps instead of daydreams","When to seek support"],"bonus":["“My plot and my people” checklist","“A week without an audience” exercise"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль головного героя за 6 вимірами","profileNote":"Відсоток середній. Профіль показує, де саме ти найбільше в центрі власної історії.","drivers":"Що найсильніше тебе виділяє","noDrv":"Жоден вимір не виділяється високо. Ти радше спостерігач.","match":"Рівень головного героя","toLow":"глядач","toHigh":"зірка"},"en":{"profile":"Your main character profile across 6 dimensions","profileNote":"The percentage is an average. The profile shows where exactly you are most at the center of your story.","drivers":"What stands out most","noDrv":"No dimension stands out as high. You're more of an observer.","match":"Main character level","toLow":"spectator","toHigh":"star"}},"bands":[{"max":39,"id":"low","ua":{"h":"Глядач у залі","p":["Ти скоріше спостерігаєш за життям, ніж граєш у ньому головну роль. Це може бути скромність і душевний комфорт, а може бути звичка віддавати кермо іншим.","Світ без головного героя ніби спокійніший, але в ньому легко загубити власні бажання. Ти маєш право бути героєм своєї історії, а не лише глядачем."],"tr":["Запиши три речі, яких ти хочеш, і зроби крок до однієї цього тижня.","Вислови власну думку там, де зазвичай мовчиш.","Помічай моменти, коли віддаєш рішення іншим просто за звичкою."],"bullets":[]},"en":{"h":"The Spectator","p":["You tend to watch life rather than play the lead in it. That can be modesty and inner comfort, or a habit of handing the wheel to others.","A world without a main character seems calmer, but in it it's easy to lose your own wishes. You have every right to be the hero of your own story, not only a viewer."],"tr":["Write down three things you want and take one step toward one this week.","Voice your own opinion where you usually stay silent.","Notice moments when you hand decisions to others out of habit."],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Режисер власного фільму","p":["У тебе здоровий баланс: ти бачиш сенс і сюжет у житті, береш відповідальність, але не забуваєш, що навколо інші люди з власними історіями.","Це найвигідніша позиція: достатньо внутрішнього сюжету, щоб мати напрямок, і достатньо уваги до інших, щоб не губити стосунки."],"tr":["Підтримуй баланс: раз на тиждень проси фідбек від близької людини.","Залишай у плані місце для спонтанності й чужих ідей.","Використай свою енергію сюжету для довгої мети, яку відкладав(-ла)."],"bullets":[]},"en":{"h":"Director of Your Own Film","p":["You have a healthy balance: you see meaning and plot in life, take responsibility, but remember that around you are other people with their own stories.","This is the most favorable position: enough inner plot to have direction, and enough attention to others not to lose relationships."],"tr":["Keep the balance: once a week ask a close person for feedback.","Leave room in the plan for spontaneity and other people's ideas.","Use your story energy for a long-term goal you've been postponing."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Зірка без сценарію","p":["Ти дуже сильно бачиш себе в центрі власної історії: багато сюжету, багато уваги до того, як тебе сприймають, і менше місця для чужих історій. Це дає харизму й драйв, але може тиснути на стосунки.","Бути головним героєм не проблема, проблема в тому, коли всі інші перетворюються на статистів. Гарна новина: цим можна керувати."],"tr":["Наступного тижня в кожній розмові поставте принаймні одне питання про іншу людину.","Запитай близького: «Чи буває, що я забагато про себе?» Вислухай до кінця.","Дай час без публікацій і реакцій: подивись, хто ти без публіки."],"bullets":[]},"en":{"h":"Star Without a Script","p":["You strongly see yourself at the center of your own story: lots of plot, lots of attention to how you're perceived, and less space for others' stories. It gives charisma and drive, but can put pressure on relationships.","Being the main character is not a problem. The problem is when everyone else turns into extras. The good news is that this can be managed."],"tr":["Next week ask at least one question about the other person in every conversation.","Ask someone close: “Do I sometimes talk about myself too much?” Hear the answer out.","Take time without posting and reactions: see who you are without an audience."],"bullets":[]}}]},{"id":"love","kind":"type","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Слова підтримки","why":"Слова для тебе це доказ почуттів. Тепле «я пишаюсь тобою» важить більше за дорогий подарунок, а мовчання часто читається як байдужість.","act":"Скажи партнеру, яких слів тобі не вистачає, конкретно: не «будь уважнішим», а «мені важливо чути, що ти мене цінуєш».","res":{"h":"Твоя мова любові: Слова","p":["Для тебе любов звучить. Ти почуваєшся коханим(-ою), коли тобі кажуть приємне, дякують, визнають твої зусилля й ніжно називають. Різкі слова ж ранять сильніше, ніж, мабуть, здається іншим.","Якщо партнер мовчазний, ти не обов'язково нелюбимий(-а): можливо, він просто «говорить» іншою мовою. Допоможи йому почути твою."],"tr":["Назви три фрази, які тобі приємно чути, і скажи про них партнеру.","Пиши близьким короткі слова вдячності без приводу.","Коли образишся на мовчання, спитай прямо, а не став діагноз."],"bullets":[]}},"en":{"n":"Words of affirmation","why":"Words are proof of feelings for you. A warm “I'm proud of you” weighs more than an expensive gift, and silence often reads as indifference.","act":"Tell your partner which words you're missing, specifically: not “be more attentive” but “I need to hear that you value me.”","res":{"h":"Your love language: Words","p":["For you, love is something you hear. You feel loved when people say kind things, thank you, acknowledge your effort and call you tender names. Harsh words hurt you more than they probably seem to hurt others.","If your partner is quiet, you're not necessarily unloved: they may simply “speak” a different language. Help them hear yours."],"tr":["Name three phrases you love to hear and tell your partner about them.","Send close people short notes of thanks for no reason.","When silence hurts, ask directly instead of diagnosing."],"bullets":[]}},"items":[{"ua":"Мене надовго гріє щире «ти молодець» чи «я тебе люблю».","en":"A sincere “well done” or “I love you” warms me for a long time.","r":0},{"ua":"Мене ранить, коли мене критикують різкими словами, навіть якщо це справедливо.","en":"Harsh words hurt me even when the criticism is fair.","r":0},{"ua":"Я люблю отримувати повідомлення, у яких пишуть, що я важливий(-а).","en":"I love getting messages that say I'm important.","r":0},{"ua":"Коли близька людина не каже мені приємних слів, я починаю сумніватись у її почуттях.","en":"When someone close doesn't say kind words to me, I start doubting their feelings.","r":0},{"ua":"Мені важливо чути подяку за те, що я роблю.","en":"It matters to me to hear thanks for what I do.","r":0},{"ua":"Я сам(-а) легко кажу близьким теплі слова.","en":"I easily say warm words to those close to me.","r":0}]},{"ua":{"n":"Час разом","why":"Для тебе любов це присутність. Не просто «разом у кімнаті», а справжня увага: без телефона, зі зверненням саме до тебе.","act":"Запропонуй партнеру регулярний «час без екранів»: 30 хвилин на день чи вечір раз на тиждень.","res":{"h":"Твоя мова любові: Час","p":["Для тебе любов це увага, віддана тобі повністю. Ти розцвітаєш, коли хтось присутній поруч по-справжньому, і в'янеш, коли «разом» означає «кожен у своєму екрані».","Твій партнер може любити тебе дуже сильно, але виявляти це справами чи словами. Покажи, що тобі дорожчий час, а не жест."],"tr":["Домовтесь про щотижневе побачення чи ритуал, який ніхто не переносить.","Говори про почуття, а не про претензії: «Мені бракує нашого часу».","Сам(-а) пропонуй спільні заняття, а не чекай, поки запросять."],"bullets":[]}},"en":{"n":"Quality time","why":"For you love is presence. Not just “together in a room” but real attention: no phone, turned toward you.","act":"Suggest to your partner regular “screen-free time”: 30 minutes a day or an evening once a week.","res":{"h":"Your love language: Time","p":["For you, love is attention given fully to you. You bloom when someone is truly present beside you and wilt when “together” means “each in their own screen.”","Your partner may love you deeply but show it through acts or words. Show them that time is what is dearest to you, not gestures."],"tr":["Agree on a weekly date or ritual that nobody moves.","Talk in feelings, not complaints: “I miss our time.”","Suggest shared activities yourself instead of waiting to be invited."],"bullets":[]}},"items":[{"ua":"Я почуваюсь коханим(-ою), коли людина відкладає телефон і слухає мене.","en":"I feel loved when someone puts away their phone and listens to me.","r":0},{"ua":"Мені важливіше провести вечір разом, ніж отримати подарунок.","en":"Spending an evening together matters more to me than receiving a gift.","r":0},{"ua":"Коли партнер постійно зайнятий, я відчуваю себе покинутим(-ою).","en":"When my partner is constantly busy, I feel abandoned.","r":0},{"ua":"Мені подобаються спільні ритуали: сніданки, прогулянки, серіали.","en":"I like shared rituals: breakfasts, walks, series.","r":0},{"ua":"Мені потрібні довгі розмови «ні про що» з близькою людиною.","en":"I need long “about nothing” conversations with someone close.","r":0},{"ua":"Мені легко бути поруч із близькими без телефона.","en":"It's easy for me to be with close people without my phone.","r":0}]},{"ua":{"n":"Подарунки","why":"Подарунок для тебе це не про ціну, а про те, що про тебе подумали, коли тебе не було поруч. Забута дата ранить сильно.","act":"Скажи близьким, що тобі приємні дрібниці. Запиши, що тобі подобається, щоб підказувати без образ.","res":{"h":"Твоя мова любові: Подарунки","p":["Для тебе любов матеріалізується. Це не про корисливість: річ стає символом, що тебе пам'ятають і бачать. Улюблена кава на столі важить більше за обіцянку «колись».","Часто такий тип вважають матеріалістичним, і це несправедливо. Для тебе цінне зусилля й увага, а не ціна."],"tr":["Поясни партнеру: «Мені важливі дрібні знаки уваги, не дорогі».","Сам(-а) складай «листа бажань» з маленьких речей.","Помічай, коли тебе радують не подарунком, а справою: це теж може бути любов."],"bullets":[]}},"en":{"n":"Receiving gifts","why":"A gift for you isn't about price but about being thought of when you weren't there. A forgotten date hurts a lot.","act":"Tell your close ones that small things delight you. Note what you like so you can hint without hurt.","res":{"h":"Your love language: Gifts","p":["For you, love becomes tangible. This isn't greed: an object becomes a symbol that you are remembered and seen. Your favorite coffee on the desk weighs more than a promise of “someday.”","This type is often called materialistic, which is unfair. What you value is effort and attention, not price."],"tr":["Explain to your partner: “Small signs of attention matter to me, not expensive ones.”","Make a wish list of small things yourself.","Notice when someone delights you not with a gift but with an act: that can be love too."],"bullets":[]}},"items":[{"ua":"Мені дуже приємно, коли про мене згадують дрібницею «просто так».","en":"I'm very pleased when someone remembers me with a small thing “just because.”","r":0},{"ua":"Я зберігаю подарунки чи записки як пам'ять про людину.","en":"I keep gifts or notes as a memory of a person.","r":0},{"ua":"Мені боляче, коли про важливу дату забувають.","en":"It hurts when an important date is forgotten.","r":0},{"ua":"Мені подобається ретельно вибирати подарунки для інших.","en":"I enjoy carefully choosing gifts for others.","r":0},{"ua":"Для мене важливо, що хтось про мене подумав, коли був далеко.","en":"It matters to me that someone thought of me when they were far away.","r":0},{"ua":"Мені байдуже, чи дарують мені щось, чи ні.","en":"I don't care whether I'm given anything or not.","r":1}]},{"ua":{"n":"Допомога справами","why":"Для тебе любов це зняти з плечей тягар. Помите посуд, зроблена справа, прибрані клопоти кажуть більше, ніж слова.","act":"Складіть спільний список побутових справ і розподіліть. Проси про допомогу конкретно, а не натяками.","res":{"h":"Твоя мова любові: Допомога","p":["Для тебе любов це дія. Ти почуваєшся цінованим(-ою), коли хтось бере на себе частину твого вантажу, і розчаровуєшся, коли слова не підкріплені справами.","Ти й сам(-а), імовірно, показуєш любов допомогою. Тільки не чекай, що партнер здогадається: проси прямо."],"tr":["Назви три конкретні справи, які найбільше облегшили б твоє життя.","Дякуй за допомогу вголос: так вона повторюватиметься.","Не відмовляйся від допомоги з гордості, дозволь собі її приймати."],"bullets":[]}},"en":{"n":"Acts of service","why":"For you love is lifting a burden. Washed dishes, a task done, a chore handled say more than words.","act":"Make a shared household list and divide it. Ask for help specifically, not by hinting.","res":{"h":"Your love language: Acts","p":["For you, love is action. You feel valued when someone takes part of your load, and you're disappointed when words aren't backed by deeds.","You likely show love through help yourself. Just don't expect your partner to guess: ask directly."],"tr":["Name three specific tasks that would make your life easiest.","Thank people for help out loud: that's how it repeats.","Don't turn down help out of pride, let yourself receive it."],"bullets":[]}},"items":[{"ua":"Мені дуже приємно, коли хтось робить за мене справу, яка мене обтяжує.","en":"I'm very touched when someone does a task for me that weighs on me.","r":0},{"ua":"Мене дратує, коли партнер каже «люблю», але не допомагає з побутом.","en":"It annoys me when a partner says “I love you” but doesn't help around the house.","r":0},{"ua":"Я показую любов тим, що роблю щось корисне для людини.","en":"I show love by doing something useful for a person.","r":0},{"ua":"Мене зворушує, коли хтось помічає, що я втомився(-лась), і береться допомогти.","en":"I'm moved when someone notices I'm tired and steps in to help.","r":0},{"ua":"Для мене «діла, а не слова» найточніший вимір любові.","en":"For me “actions, not words” is the most accurate measure of love.","r":0},{"ua":"Я легко приймаю допомогу від близьких.","en":"I easily accept help from close people.","r":0}]},{"ua":{"n":"Дотик","why":"Для тебе любов у тілі: обійми, рука в руці, плече поруч. Без дотику слова можуть здаватись порожніми.","act":"Домовтесь про щоденні мікрожести: обійми зранку, рука на плечі. Це знижує тривогу краще за розмови.","res":{"h":"Твоя мова любові: Дотик","p":["Для тебе любов відчувається шкірою. Обійми, дотик, близькість тіла дають тобі безпеку, якої слова не замінять. Холодність у фізичному контакті ти сприймаєш як холодність у почуттях.","Якщо ви на відстані, шукай інші способи відчуття близькості: голосові, відеодзвінки, речі з запахом коханої людини."],"tr":["Домовтесь про щоденні обійми принаймні по 20 секунд.","Скажи про свою потребу без образи: «Мені допомагає, коли ти мене обіймаєш».","На відстані: надсилай голосові й домовляйся про ритуал зустрічі."],"bullets":[]}},"en":{"n":"Physical touch","why":"For you love lives in the body: hugs, a hand in yours, a shoulder nearby. Without touch words can feel empty.","act":"Agree on daily micro-gestures: a hug in the morning, a hand on the shoulder. This lowers anxiety better than talk.","res":{"h":"Your love language: Touch","p":["For you love is felt through the skin. Hugs, touch, bodily closeness give you a safety that words can't replace. Coldness in physical contact you read as coldness in feelings.","If you are apart, look for other ways to feel close: voice notes, video calls, items that smell of your loved one."],"tr":["Agree on daily hugs of at least 20 seconds.","State your need without resentment: “It helps me when you hug me.”","At a distance: send voice notes and agree on a reunion ritual."],"bullets":[]}},"items":[{"ua":"Обійми допомагають мені заспокоїтись краще, ніж слова.","en":"A hug calms me better than words.","r":0},{"ua":"Мені комфортно, коли партнер береже тілесний контакт: тримає за руку, торкається.","en":"I'm comfortable when my partner keeps physical contact: holds my hand, touches me.","r":0},{"ua":"Мені бракує дотиків, коли ми довго не бачимось.","en":"I miss touch when we haven't seen each other for a long time.","r":0},{"ua":"Мені важливо торкатись людини, поки ми розмовляємо.","en":"I like to touch a person while we talk.","r":0},{"ua":"У складний момент мені більше потрібні обійми, ніж поради.","en":"In a hard moment I need a hug more than advice.","r":0},{"ua":"Я не люблю фізичного контакту навіть з близькими.","en":"I don't like physical contact even with close people.","r":1}]}],"who":{"ua":["Мови любові це зручна модель, а не точна наука. Більшість людей мають кілька мов, і вони змінюються залежно від періоду життя та ситуації.","Варто звернутись до парного психотерапевта, якщо ви з партнером постійно не чуєте одне одного, не дивлячись на спроби. Це не діагноз, а орієнтир."],"en":["Love languages are a handy model, not an exact science. Most people have several languages, and they shift with life stage and situation.","Consider couples therapy if you and your partner keep not hearing each other despite trying. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"П'ять мов любові: як почути себе і партнера","d":"Готовий PDF-гайд по мовах любові: твоя головна мова, як пояснити її партнеру й навчитись розуміти його «діалект». Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Модель мов любові та її обмеження","П'ять мов: як вони проявляються в повсякденні","Як поєднуються різні мови в парі й де виникають конфлікти","Вправи й розмови: як просити про своє без образ","Коли пара потребує допомоги ззовні"],"bonus":["чекліст «Моя мова любові для партнера»","шаблон розмови «Мені важливо, щоб…»"]},"en":{"t":"Five Love Languages: How to Hear Yourself and Your Partner","d":"A ready-made PDF guide to love languages: your main language, how to explain it to a partner and how to learn to understand theirs. No filler or motivational quotes. It lands in your inbox right after payment.","days":["The love language model and its limits","Five languages: how they show up day to day","How languages combine in couples and where conflicts come from","Exercises and conversations: how to ask for what you need without hurt","When a couple needs outside help"],"bonus":["“My love language for my partner” checklist","“It matters to me that…” conversation template"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твої п'ять мов любові","profileNote":"Найвища мова це твоя головна. Інші показують, що ще звучить у тобі."},"en":{"profile":"Your five love languages","profileNote":"The highest language is your primary one. The others show what else speaks in you."}}},{"id":"adhd","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Утримання уваги","why":"Труднощі з утриманням уваги часто плутають із лінню. Насправді мозок може легко «горіти» на цікавому й вимикатись на нудному.","act":"Працюй короткими блоками по 25 хвилин із таймером і 5-хвилинною паузою. Прибери телефон з поля зору."},"en":{"n":"Sustaining attention","why":"Trouble holding attention is often mistaken for laziness. In reality the brain may easily “burn” on what's interesting and switch off on what's boring.","act":"Work in short 25-minute blocks with a timer and a 5-minute break. Keep your phone out of sight."},"items":[{"ua":"Мені важко довго зосереджуватись на нудній чи рутинній роботі.","en":"I find it hard to stay focused for long on boring or routine work.","r":0},{"ua":"Під час розмови я іноді ловлю себе на тому, що не чув(-ла), що мені щойно сказали.","en":"During a conversation I sometimes realize I didn't hear what was just said to me.","r":0},{"ua":"Мене легко відволікають сторонні звуки чи думки.","en":"I'm easily distracted by outside sounds or thoughts.","r":0},{"ua":"Я починаю читати чи дивитись щось і втрачаю нитку.","en":"I start reading or watching something and lose the thread.","r":0},{"ua":"Я можу сидіти над однією справою годинами без відволікань.","en":"I can sit on one task for hours without distraction.","r":1}]},{"ua":{"n":"Організованість і планування","why":"Це не про «неохайність». Планування вимагає утримувати в голові кроки й порядок, і саме це може бути складним.","act":"Винеси план із голови: один список на день, три пріоритети, нагадування в телефоні для кожної дати."},"en":{"n":"Organization and planning","why":"This isn't about “messiness.” Planning requires holding steps and order in mind, and that is exactly what can be hard.","act":"Take the plan out of your head: one list a day, three priorities, a phone reminder for every date."},"items":[{"ua":"Мені складно розбивати великі справи на кроки й у правильному порядку.","en":"I find it hard to break big tasks into steps in the right order.","r":0},{"ua":"Мій робочий стіл чи сумка часто в безладі, я постійно щось шукаю.","en":"My desk or bag is often a mess and I'm always looking for something.","r":0},{"ua":"Я часто забуваю про зустрічі, дедлайни чи оплати.","en":"I often forget meetings, deadlines or payments.","r":0},{"ua":"Я відкладаю справи майже до останнього моменту.","en":"I put things off almost to the last moment.","r":0},{"ua":"Мені легко підтримувати порядок і систему в справах.","en":"I find it easy to maintain order and a system.","r":1}]},{"ua":{"n":"Рухливість і внутрішній неспокій","why":"У дорослих гіперактивність зазвичай не бігання, а внутрішній мотор: складно сидіти, постійно щось крутиш у руках чи в голові.","act":"Дай тілу рух: 10 хвилин активності кожні дві години. Працюй стоячи чи ходи під час дзвінків."},"en":{"n":"Restlessness","why":"In adults hyperactivity is usually not running around but an inner motor: hard to sit still, always fiddling with something in hands or head.","act":"Give your body movement: 10 minutes of activity every two hours. Work standing or pace during calls."},"items":[{"ua":"Мені важко довго сидіти без руху на нарадах чи парах.","en":"I find it hard to sit still for long in meetings or classes.","r":0},{"ua":"Я часто кручу щось у руках, стукаю ногою чи гойдаюсь.","en":"I often fidget with something, tap my foot or rock.","r":0},{"ua":"Всередині в мене ніби постійно працює «мотор».","en":"Inside me an “engine” seems to run all the time.","r":0},{"ua":"Мені важко розслабитись і нічого не робити.","en":"I find it hard to relax and do nothing.","r":0},{"ua":"Я спокійно можу годину просто сидіти без діла.","en":"I can calmly sit for an hour doing nothing.","r":1}]},{"ua":{"n":"Імпульсивність","why":"Імпульсивність це «спочатку зроблю, потім подумаю». У ній є і ціна (покупки, перебивання), і плюс (швидкість, сміливість).","act":"Введи правило 24 годин для непланованих покупок і великих рішень. Запис в нотатки замість негайної дії."},"en":{"n":"Impulsivity","why":"Impulsivity is “do first, think later.” It has a cost (purchases, interrupting) and an upside (speed, boldness).","act":"Use a 24-hour rule for unplanned purchases and big decisions. Write it in notes instead of acting at once."},"items":[{"ua":"Я часто перебиваю людей чи договорюю за них.","en":"I often interrupt people or finish their sentences.","r":0},{"ua":"Я роблю спонтанні покупки й потім жалкую.","en":"I make spontaneous purchases and regret them later.","r":0},{"ua":"Мені важко чекати своєї черги у розмові чи в черзі.","en":"I find it hard to wait my turn in conversation or in line.","r":0},{"ua":"Я іноді говорю або роблю щось, не подумавши про наслідки.","en":"I sometimes say or do things without thinking about consequences.","r":0},{"ua":"Перш ніж прийняти рішення, я зазвичай обдумую його кілька разів.","en":"Before deciding I usually think it through several times.","r":1}]},{"ua":{"n":"Емоції й реакції","why":"Дорослі з рисами СДУГ часто описують «короткий запал»: швидке роздратування чи сильні реакції на фрустрацію, і швидко відходять.","act":"Коли спалахуєш, зроби паузу на 90 секунд: дихання й вода. Вона дає мозку шанс наздогнати реакцію."},"en":{"n":"Emotional regulation","why":"Adults with ADHD traits often describe a “short fuse”: quick irritation or strong reactions to frustration, then recovery.","act":"When you flare up, pause for 90 seconds: breathing and water. It gives the brain a chance to catch up with the reaction."},"items":[{"ua":"Мене швидко виводять з рівноваги дрібні невдачі.","en":"Small failures quickly knock me off balance.","r":0},{"ua":"Мій настрій може різко змінюватись протягом дня.","en":"My mood can change sharply during the day.","r":0},{"ua":"Я сильно переживаю критику чи відмову.","en":"I take criticism or rejection very hard.","r":0},{"ua":"Коли мені нудно чи несправедливо, я дратуюсь швидше за інших.","en":"When I'm bored or feel treated unfairly I get irritated faster than others.","r":0},{"ua":"Мені зазвичай легко залишатись спокійним(-ою) під тиском.","en":"It's usually easy for me to stay calm under pressure.","r":1}]},{"ua":{"n":"Пам'ять і виконавчі функції","why":"Робоча пам'ять це «блокнот» мозку. Коли він маленький, ти забуваєш, навіщо зайшов у кімнату, чи губиш думку посеред речення.","act":"Не покладайся на пам'ять: фото, нагадування, речі на видному місці біля виходу. Меншою кількістю рішень на день зберігаєш ресурс."},"en":{"n":"Working memory and executive function","why":"Working memory is the brain's “notepad.” When it's small, you forget why you walked into a room or lose your thought mid-sentence.","act":"Don't rely on memory: photos, reminders, items by the door. Fewer daily decisions saves resource."},"items":[{"ua":"Я забуваю, навіщо зайшов(-ла) в кімнату, або губив(-ла) думку посеред речення.","en":"I forget why I entered a room or lose my thought mid-sentence.","r":0},{"ua":"Я часто гублю ключі, телефон, гаманець чи документи.","en":"I often lose keys, phone, wallet or documents.","r":0},{"ua":"Мені потрібні нагадування, інакше я забуваю про побутові дрібниці.","en":"I need reminders or I forget everyday small things.","r":0},{"ua":"Інструкції, які мені розповіли усно, я швидко забуваю.","en":"I quickly forget instructions given to me verbally.","r":0},{"ua":"Я зазвичай пам'ятаю, що планував(-ла) зробити, без нагадувань.","en":"I usually remember what I planned to do without reminders.","r":1}]}],"who":{"ua":["Це скринінг за самозвітом, а не діагностичний тест. Діагноз СДУГ ставить тільки лікар чи клінічний психолог після повного обстеження, з історією з дитинства та урахуванням інших станів.","Звернись до фахівця, якщо труднощі з увагою, організацією чи імпульсивністю давно заважають роботі, навчанню чи стосункам. Не починай і не змінюй лікування за результатом цього тесту. Це не діагноз, а орієнтир."],"en":["This is a self-report screening, not a diagnostic test. An ADHD diagnosis is made only by a doctor or clinical psychologist after a full evaluation, with childhood history and other conditions considered.","Contact a specialist if difficulties with attention, organization or impulsivity have long interfered with work, study or relationships. Do not start or change treatment based on this test. It isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Мозок з відкритими вкладками: як працювати з увагою дорослому","d":"Готовий PDF-гайд про увагу та риси СДУГ у дорослих: як відрізнити їх від стресу й тривоги, які системи й інструменти реально працюють і як підготуватись до розмови зі спеціалістом. Це не лікування. Приходить на email одразу після оплати.","days":["Що таке СДУГ у дорослих і чим він не є","Шість зон: увага, порядок, рух, імпульс, емоції, пам'ять","Зовнішні опори: системи, таймери, середовище","Як підготуватись до візиту до лікаря й що там буде","Життя з особливостями уваги: робота, стосунки, самоповага"],"bonus":["чекліст для розмови зі спеціалістом","система «Один список» для щоденного планування"]},"en":{"t":"A Brain With Open Tabs: Working With Attention as an Adult","d":"A ready-made PDF guide to attention and ADHD traits in adults: how to tell them from stress and anxiety, which systems and tools really work and how to prepare for a conversation with a specialist. It is not treatment. It lands in your inbox right after payment.","days":["What ADHD in adults is and what it isn't","Six areas: attention, order, movement, impulse, emotions, memory","External supports: systems, timers, environment","How to prepare for a doctor's visit and what to expect","Living with attention differences: work, relationships, self-respect"],"bonus":["Checklist for talking to a specialist","“One list” daily planning system"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль уваги за 6 зонами","profileNote":"Відсоток середній. Профіль показує, де труднощі виражені найбільше. Це не діагноз.","drivers":"Де найбільше труднощів","noDrv":"Жодна зона не виділяється високо. Це гарний знак.","match":"Збіг із рисами СДУГ","toLow":"мало збігів","toHigh":"багато збігів"},"en":{"profile":"Your attention profile across 6 areas","profileNote":"The percentage is an average. The profile shows where difficulties are strongest. This is not a diagnosis.","drivers":"Where it's hardest","noDrv":"No area stands out as high. That's a good sign.","match":"Match with ADHD traits","toLow":"few matches","toHigh":"many matches"}},"bands":[{"max":39,"id":"low","ua":{"h":"Скоріше не про це","p":["У твоїх відповідях небагато збігів із рисами, які описують у дорослих із СДУГ. Труднощі з увагою чи організацією, якщо вони бувають, радше пов'язані зі стресом, недосипом чи навантаженням.","Це не виключає нічого і не є діагнозом. Але на цьому тлі навряд чи варто шукати у себе СДУГ."],"tr":["Подбай про сон, режим і рух: це найчастіше повертає увагу.","Зменш кількість одночасних завдань і сповіщень.","Якщо труднощі з'явились нещодавно, зверни увагу на стрес і самопочуття."],"bullets":[]},"en":{"h":"Probably Not This","p":["Your answers show few matches with traits described in adults with ADHD. Difficulties with attention or organization, if they happen, are more likely linked to stress, lack of sleep or workload.","This rules nothing out and is not a diagnosis. But against this background there is little reason to look for ADHD in yourself."],"tr":["Take care of sleep, routine and movement: this most often brings attention back.","Reduce the number of simultaneous tasks and notifications.","If difficulties appeared recently, look at stress and well-being."],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Є риси, варто придивитись","p":["У тебе є кілька рис, які зустрічаються у дорослих із СДУГ: у частині сфер уважність чи організованість дається важче, ніж іншим. Це можуть бути індивідуальні особливості, стрес, недосипання або тривога.","Це не діагноз. Але якщо ці труднощі давно заважають тобі в роботі чи стосунках, варто обговорити їх зі спеціалістом."],"tr":["Запиши, коли саме тобі найважче: у яких ситуаціях і з яких років.","Спробуй зовнішні опори: списки, таймери, нагадування.","Розглянь консультацію з психіатром чи клінічним психологом, якщо труднощі існують давно."],"bullets":[]},"en":{"h":"Some Traits Worth Noticing","p":["You have several traits that appear in adults with ADHD: in some areas attention or organization is harder for you than for others. These can be individual traits, stress, lack of sleep or anxiety.","This is not a diagnosis. But if these difficulties have long gotten in the way of work or relationships, it's worth discussing them with a specialist."],"tr":["Write down when it's hardest: in which situations and since what age.","Try external supports: lists, timers, reminders.","Consider a consultation with a psychiatrist or clinical psychologist if difficulties have existed for a long time."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Багато збігів: варто до фахівця","p":["У твоїх відповідях багато збігів із рисами, які описують у дорослих із СДУГ. Це лише скринінг за самозвітом, а не діагноз: схожі прояви дають тривога, депресія, порушення сну та інші стани.","Але таких збігів достатньо, щоб запланувати професійну оцінку. Діагностику ставлять лікар або клінічний психолог, і вона допомагає підібрати підтримку, яка реально працює."],"tr":["Запишись на консультацію до психіатра чи клінічного психолога й візьми цей результат як відправну точку.","Згадай, як це було в дитинстві: шкільні табелі та відгуки вчителів допомагають спеціалісту.","А поки що використовуй зовнішні опори: нагадування, списки, короткі робочі блоки."],"bullets":[]},"en":{"h":"Many Matches: Worth Seeing a Specialist","p":["Your answers show many matches with traits described in adults with ADHD. This is only a self-report screening, not a diagnosis: anxiety, depression, sleep problems and other conditions can look similar.","But such matches are enough to plan a professional evaluation. A diagnosis is made by a doctor or clinical psychologist, and it helps find support that really works."],"tr":["Book a consultation with a psychiatrist or clinical psychologist and take this result as a starting point.","Recall how it was in childhood: school reports and teachers' remarks help the specialist.","Meanwhile use external supports: reminders, lists, short work blocks."],"bullets":[]}}]},{"id":"perfect","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Високі стандарти","why":"Високі стандарти самі по собі це сила. Вони стають пасткою, коли планка лише піднімається і ніколи не «зараховується».","act":"Для однієї справи цього тижня заздалегідь визнач, що таке «достатньо добре», і зупинись, коли це досягнуто."},"en":{"n":"High standards","why":"High standards on their own are a strength. They become a trap when the bar only rises and is never “counted.”","act":"For one task this week decide in advance what “good enough” is, and stop when you reach it."},"items":[{"ua":"Я ставлю до своєї роботи вищі вимоги, ніж більшість людей навколо.","en":"I set higher requirements for my work than most people around me.","r":0},{"ua":"Мені важко вважати результат хорошим, якщо він не ідеальний.","en":"I find it hard to call a result good if it isn't perfect.","r":0},{"ua":"Навіть коли в мене виходить добре, я думаю, що можна було краще.","en":"Even when I do well I think it could have been better.","r":0},{"ua":"Мені неприємно здавати роботу, у якій я бачу хоч один недолік.","en":"I dislike handing in work in which I can see even one flaw.","r":0},{"ua":"Мене влаштовує результат «достатньо добре».","en":"A “good enough” result suits me fine.","r":1}]},{"ua":{"n":"Страх помилок","why":"Помилка для перфекціоніста це не інформація, а вирок. Через це мозок вчиться уникати ризику, а не рости.","act":"Зроби навмисно одну маленьку неідеальну річ (лист з опечаткою, неприбране ліжко) і подивись, що станеться. Зазвичай нічого."},"en":{"n":"Fear of mistakes","why":"For a perfectionist a mistake isn't information but a verdict. The brain therefore learns to avoid risk, not to grow.","act":"Deliberately do one small imperfect thing (an email with a typo, an unmade bed) and see what happens. Usually nothing."},"items":[{"ua":"Мене надовго виводить з рівноваги власна помилка.","en":"My own mistake throws me off for a long time.","r":0},{"ua":"Я багато разів перевіряю роботу, перш ніж віддати її.","en":"I check my work many times before handing it over.","r":0},{"ua":"Я уникаю нового, якщо боюсь зробити це погано.","en":"I avoid new things if I'm afraid of doing them badly.","r":0},{"ua":"Мені соромно, коли хтось помічає мою помилку.","en":"I feel ashamed when someone notices my mistake.","r":0},{"ua":"Я спокійно ставлюсь до власних помилок і вчуся на них.","en":"I treat my own mistakes calmly and learn from them.","r":1}]},{"ua":{"n":"Сумніви у власних діях","why":"Сумніви змушують ніколи не відчувати завершення: навіть зробивши, ти не певен(-на), що зробив(-ла) правильно.","act":"Після виконання справи вимовляй вголос: «Це зроблено». Не перевіряй більше одного разу."},"en":{"n":"Doubts about actions","why":"Doubts take away any sense of completion: even after doing it you aren't sure you did it right.","act":"After finishing a task say out loud: “It's done.” Don't check more than once."},"items":[{"ua":"Після відправки листа я перечитую його, шукаючи помилки.","en":"After sending an email I reread it looking for mistakes.","r":0},{"ua":"Мені складно відчути, що справа справді завершена.","en":"It's hard for me to feel a task is really finished.","r":0},{"ua":"Я часто не впевнений(-а), що все зробив(-ла) правильно.","en":"I'm often unsure I did everything right.","r":0},{"ua":"Мені потрібно кілька разів переконатись, що все зроблено так, як треба.","en":"I need to make sure several times that everything is done as it should be.","r":0},{"ua":"Закінчивши справу, я легко про неї забуваю.","en":"Once I finish a task I easily forget about it.","r":1}]},{"ua":{"n":"Все або нічого","why":"Чорно-біле мислення: або ідеально, або провал. Саме воно штовхає відкладати й кидати, бо «погано» здається гіршим за «ніяк».","act":"Заміни «ідеально чи нічого» на «10 хвилин чорнового варіанту». Чернетка не обов'язково гарна."},"en":{"n":"All or nothing","why":"Black-and-white thinking: perfect or failure. It pushes you to postpone and quit, because “badly” seems worse than “not at all.”","act":"Replace “perfect or nothing” with “10 minutes of a rough draft.” A draft doesn't have to be good."},"items":[{"ua":"Якщо я не можу зробити щось добре, мені хочеться взагалі не братись.","en":"If I can't do something well I'd rather not start at all.","r":0},{"ua":"Я відкладаю справи, бо чекаю ідеального моменту чи настрою.","en":"I postpone things because I'm waiting for the perfect moment or mood.","r":0},{"ua":"Коли щось іде не за планом, мені хочеться все кинути.","en":"When something goes off plan I want to drop everything.","r":0},{"ua":"Для мене результат 90% майже не відрізняється від провалу.","en":"For me a 90% result is hardly different from failure.","r":0},{"ua":"Я легко починаю справу, навіть якщо знаю, що вийде неідеально.","en":"I easily start a task even if I know it won't be perfect.","r":1}]},{"ua":{"n":"Внутрішній критик","why":"Критик у голові називає це «мотивацією», але насправді його метод це тиск. Люди, які добрі до себе, зазвичай досягають не менше.","act":"Коли критик говорить, перепиши його фразу так, як сказав би другові. Без поблажок, але без образ."},"en":{"n":"Inner critic","why":"The critic in your head calls it “motivation,” but its method is pressure. People who are kind to themselves usually achieve no less.","act":"When the critic speaks, rewrite its phrase the way you'd say it to a friend. No indulgence, but no insults."},"items":[{"ua":"Коли в мене не виходить, я кажу собі дуже різкі слова.","en":"When I fail I say very harsh words to myself.","r":0},{"ua":"Я рідко хвалю себе, навіть за справді хороший результат.","en":"I rarely praise myself, even for a really good result.","r":0},{"ua":"Мені здається, що якщо я пом'якшу вимоги, я перестану розвиватись.","en":"I feel that if I soften my demands I'll stop developing.","r":0},{"ua":"Я порівнюю свої результати з тими, хто досяг більше.","en":"I compare my results with those who achieved more.","r":0},{"ua":"Я здатен(-на) підтримати себе у невдачі так, як підтримав(-ла) б друга.","en":"I can support myself in failure the way I would support a friend.","r":1}]},{"ua":{"n":"Очікування інших","why":"Частина перфекціонізму виростає з відчуття, що тебе люблять за результат. Тоді кожна помилка виглядає як ризик втратити повагу.","act":"Запитай близьку людину, за що вона тебе цінує. Часто це не те, що ти ідеально робиш."},"en":{"n":"Others' expectations","why":"Part of perfectionism grows from a feeling that you're loved for results. Then every mistake looks like a risk of losing respect.","act":"Ask someone close what they value you for. Often it's not what you do perfectly."},"items":[{"ua":"Мені здається, що інші очікують від мене безпомилковості.","en":"I feel that others expect flawlessness from me.","r":0},{"ua":"Я боюсь розчарувати людей, якщо буду «недостатньо хорошим(-ою)».","en":"I'm afraid of disappointing people if I'm “not good enough.”","r":0},{"ua":"Мені здається, що мене цінують за досягнення більше, ніж за мене самого(-у).","en":"I feel I'm valued for achievements more than for myself.","r":0},{"ua":"Я намагаюсь показувати людям лише успішну версію себе.","en":"I try to show people only my successful version.","r":0},{"ua":"Я відчуваю, що близькі люблять мене й коли я помиляюсь.","en":"I feel that those close to me love me even when I make mistakes.","r":1}]}],"who":{"ua":["Перфекціонізм це не діагноз. Це стиль мислення, який у помірній формі допомагає, а в сильній виснажує. Тест показує, де саме тобі важче.","Варто звернутись до психотерапевта, якщо перфекціонізм супроводжується постійною тривогою, відкладанням справ, безсонням чи думками, що ти «ніколи не достатній(-я)». Добре працює когнітивно-поведінкова терапія. Це не діагноз, а орієнтир."],"en":["Perfectionism isn't a diagnosis. It's a thinking style that helps in moderation and exhausts when strong. The test shows where exactly it's harder for you.","Consider a therapist if perfectionism comes with constant anxiety, procrastination, insomnia or thoughts that you're “never enough.” Cognitive behavioral therapy works well. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Достатньо добре: як відпустити ідеал і не втратити якість","d":"Готовий PDF-гайд по перфекціонізму: звідки він береться, де допомагає, а де руйнує, і як зробити так, щоб планка працювала на тебе. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Перфекціонізм: здорове прагнення чи пастка","Шість вимірів і як вони проявляються","Страх помилок і критик: вправи для пом'якшення","Практики «достатньо добре»: чернетки, ліміти, завершення","Коли варто звернутись по підтримку"],"bonus":["щоденник «Достатньо добре» на 14 днів","шаблон розмови «Я не обов'язково ідеальний(-а)»"]},"en":{"t":"Good Enough: Letting Go of the Ideal Without Losing Quality","d":"A ready-made PDF guide to perfectionism: where it comes from, where it helps and where it harms, and how to make the bar work for you. No filler or motivational quotes. It lands in your inbox right after payment.","days":["Perfectionism: healthy striving or a trap","Six dimensions and how they show up","Fear of mistakes and the critic: softening exercises","“Good enough” practices: drafts, limits, finishing","When to seek support"],"bonus":["14-day “Good enough” journal","“I don't have to be perfect” conversation template"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль перфекціонізму за 6 вимірами","profileNote":"Відсоток середній. Профіль показує, де саме перфекціонізм тисне найсильніше.","drivers":"Де планка тисне найбільше","noDrv":"Жоден вимір не виділяється високо. Це гарний знак.","match":"Рівень перфекціонізму","toLow":"спокійно","toHigh":"пастка ідеалу"},"en":{"profile":"Your perfectionism profile across 6 dimensions","profileNote":"The percentage is an average. The profile shows where perfectionism presses hardest.","drivers":"Where the bar presses most","noDrv":"No dimension stands out as high. That's a good sign.","match":"Perfectionism level","toLow":"relaxed","toHigh":"perfection trap"}},"bands":[{"max":39,"id":"low","ua":{"h":"Здорове прагнення","p":["Ти любиш робити добре, але не ціною спокою. Помилки тебе не руйнують, а результат «достатньо добре» тебе не мучить. Це дуже корисна позиція.","Уміння відрізняти прагнення до якості від прагнення до недосяжного ідеалу це вже половина справи."],"tr":["Запиши, що тобі допомагає не застрягати. Це твій особистий ресурс.","Підтримуй звичку завершувати справи й рухатись далі.","Якщо ти допомагаєш перфекціоністу, дай йому просту підтримку без порад."],"bullets":[]},"en":{"h":"Healthy Striving","p":["You like doing things well but not at the cost of peace. Mistakes don't wreck you, and a “good enough” result doesn't torment you. This is a very useful position.","The ability to tell the pursuit of quality from the pursuit of an unreachable ideal is already half the work."],"tr":["Write down what helps you not get stuck. It's your personal resource.","Keep the habit of finishing tasks and moving on.","If you help a perfectionist, give simple support without advice."],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Перфекціонізм із ціною","p":["У тебе є помітні ознаки перфекціонізму: високі вимоги, страх помилок чи сумніви. Інколи вони допомагають, а інколи забирають багато енергії й радості.","Це поки ще гнучка зона. Тут легко знайти баланс, якщо помічати, де планка допомагає, а де лише тисне."],"tr":["Для однієї справи цього тижня визнач критерій «достатньо» і зупинись на ньому.","Зроби чернетку замість ідеального першого варіанту.","Говори до себе так, як говорив(-ла) б другові."],"bullets":[]},"en":{"h":"Perfectionism With a Price","p":["You have noticeable signs of perfectionism: high demands, fear of mistakes or doubts. Sometimes they help and sometimes they cost a lot of energy and joy.","This is still a flexible zone. It's easy to find a balance here if you notice where the bar helps and where it only presses."],"tr":["For one task this week set a “good enough” criterion and stop at it.","Make a draft instead of a perfect first version.","Talk to yourself the way you would to a friend."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Пастка ідеалу","p":["Твої відповіді показують сильний перфекціонізм: високі вимоги разом із страхом помилок, сумнівами й різким внутрішнім критиком. Це не про «трудоголізм», а про постійне відчуття, що ти недостатній(-я).","Така напруга часто веде до відкладання, втоми й тривоги. Гарна новина: це вивчена стратегія, і її можна пом'якшувати."],"tr":["Цього тижня зроби одну справу «на трійку» навмисно й подивись, що станеться.","Скажи вголос одній людині: «Мені важко, коли вийшло не ідеально».","Розглянь консультацію з психотерапевтом, особливо якщо перфекціонізм супроводжується тривогою, безсонням чи виснаженням."],"bullets":[]},"en":{"h":"The Perfection Trap","p":["Your answers show strong perfectionism: high demands together with fear of mistakes, doubts and a sharp inner critic. This isn't “workaholism” but a constant feeling that you're not enough.","This tension often leads to procrastination, exhaustion and anxiety. The good news: it's a learned strategy, and it can be softened."],"tr":["This week do one task “at a C” on purpose and see what happens.","Say out loud to one person: “It's hard for me when something isn't perfect.”","Consider a therapist, especially if perfectionism comes with anxiety, insomnia or exhaustion."],"bullets":[]}}]},{"id":"procrast","kind":"level","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Втеча від неприємних відчуттів","why":"Прокрастинація це не про час, а про емоції. Справа викликає нудьгу, страх чи роздратування, і мозок рятується від цього відчуття, а не від самої справи.","act":"Коли тягне відкласти, назви відчуття вголос: «Мені нудно» чи «Я боюсь». Потім роби лише 5 хвилин."},"en":{"n":"Escaping unpleasant feelings","why":"Procrastination isn't about time but about emotions. A task triggers boredom, fear or irritation, and the brain escapes the feeling, not the task itself.","act":"When you feel the pull to postpone, name the feeling out loud: “I'm bored” or “I'm afraid.” Then work for just 5 minutes."},"items":[{"ua":"Я відкладаю справи, від яких мені стає нудно чи тривожно.","en":"I put off tasks that make me bored or anxious.","r":0},{"ua":"Замість складної справи я беру легшу й кажу собі, що це теж «робота».","en":"Instead of a hard task I take an easier one and tell myself it's “work” too.","r":0},{"ua":"Коли я думаю про неприємну справу, мені хочеться відволіктись.","en":"When I think about an unpleasant task I want to distract myself.","r":0},{"ua":"Я скролю телефон саме тоді, коли треба братись за важке.","en":"I scroll my phone exactly when it's time to start something hard.","r":0},{"ua":"Я можу сісти за неприємну справу, навіть якщо мені не хочеться.","en":"I can sit down to an unpleasant task even if I don't feel like it.","r":1}]},{"ua":{"n":"Відчуття часу й планування","why":"Мозок, схильний до відкладання, недооцінює, скільки часу потрібно, і переоцінює завтрашні сили. Саме тому «встигну» не працює.","act":"Помнож свою оцінку часу на півтора й додай буфер. Запиши, скільки справді пішло."},"en":{"n":"Time sense and planning","why":"A brain prone to delaying underestimates how long things take and overestimates tomorrow's energy. That's why “I'll make it” doesn't work.","act":"Multiply your time estimate by one and a half and add a buffer. Write down how long it really took."},"items":[{"ua":"Я зазвичай недооцінюю, скільки часу піде на завдання.","en":"I usually underestimate how long a task will take.","r":0},{"ua":"Я думаю: «Завтра в мене буде більше сил і часу».","en":"I think: “Tomorrow I'll have more energy and time.”","r":0},{"ua":"Я рідко складаю чіткий план, коли справа велика.","en":"I rarely make a clear plan when a task is big.","r":0},{"ua":"Дедлайни для мене стають реальними лише тоді, коли вони дуже близько.","en":"Deadlines only become real to me when they're very close.","r":0},{"ua":"Я зазвичай роблю великі справи по частинах і заздалегідь.","en":"I usually do big tasks in parts and well in advance.","r":1}]},{"ua":{"n":"Страх невдачі й оцінки","why":"Для багатьох відкладання це спосіб захистити самооцінку: якщо не вийшло, то «просто не було часу», а не «я не вмію».","act":"Запусти «поганий перший варіант»: 10 хвилин чернетки без правок. Оцінка потім, не під час."},"en":{"n":"Fear of failure and judgment","why":"For many, delaying is a way to protect self-esteem: if it fails, it's “there was no time,” not “I can't do it.”","act":"Start a “bad first draft”: 10 minutes with no edits. Judgment comes later, not during."},"items":[{"ua":"Я відкладаю справу, бо боюсь, що в мене не вийде добре.","en":"I delay a task because I'm afraid I won't do it well.","r":0},{"ua":"Мені легше сказати «не встиг», ніж «не вийшло».","en":"It's easier for me to say “I ran out of time” than “it didn't work.”","r":0},{"ua":"Я боюсь, що результат оцінять і знайдуть недоліки.","en":"I'm afraid the result will be judged and flaws found.","r":0},{"ua":"Я не починаю, поки не знаю, як зробити ідеально.","en":"I don't start until I know how to do it perfectly.","r":0},{"ua":"Мене не лякає здати роботу, яка не ідеальна.","en":"It doesn't scare me to hand in work that isn't perfect.","r":1}]},{"ua":{"n":"Увага й відволікання","why":"Сучасне середовище влаштоване так, щоб тебе відволікати. Прокрастинація часто це не слабка воля, а перевантажене оточення.","act":"Прибери з робочого місця все, крім справи. Телефон в іншу кімнату на один блок 25 хвилин."},"en":{"n":"Attention and distraction","why":"The modern environment is designed to distract you. Procrastination is often not weak willpower but an overloaded environment.","act":"Clear your workspace of everything but the task. Phone in another room for one 25-minute block."},"items":[{"ua":"Під час роботи я перевіряю повідомлення чи соцмережі кожні кілька хвилин.","en":"While working I check messages or social media every few minutes.","r":0},{"ua":"Мені важко зайти в роботу: я довго «розганяюсь».","en":"I find it hard to get into work: I take a long time to “warm up.”","r":0},{"ua":"Я легко відволікаюсь на будь-що цікавіше.","en":"I'm easily distracted by anything more interesting.","r":0},{"ua":"Я часто відкриваю «ще одну вкладку» й гублю нитку.","en":"I often open “just one more tab” and lose the thread.","r":0},{"ua":"Коли я працюю, телефон мене майже не відволікає.","en":"When I work my phone hardly distracts me.","r":1}]},{"ua":{"n":"Рішення й старт","why":"Найважче не робити, а почати. Чим менше крок, тим менший опір, тому старт треба зменшувати до смішного.","act":"Визнач «найменший крок»: відкрити файл, написати одне речення, одягнути кросівки. Зроби лише його."},"en":{"n":"Decisions and starting","why":"The hardest part isn't doing but starting. The smaller the step, the smaller the resistance, so shrink the start to something laughable.","act":"Define the “smallest step”: open the file, write one sentence, put on your sneakers. Do only that."},"items":[{"ua":"Я довго обираю, з чого почати, і так і не починаю.","en":"I spend long choosing where to start and never start.","r":0},{"ua":"Велика справа здається мені такою важкою, що я навіть не знаю, з чого почати.","en":"A big task feels so heavy I don't even know where to begin.","r":0},{"ua":"Я чекаю «правильного настрою» чи натхнення.","en":"I wait for the “right mood” or inspiration.","r":0},{"ua":"Я переношу початок на «з понеділка» чи «з нового місяця».","en":"I move the start to “from Monday” or “from next month.”","r":0},{"ua":"Я зазвичай починаю відразу, не чекаючи ідеальних умов.","en":"I usually start right away without waiting for ideal conditions.","r":1}]},{"ua":{"n":"Цикл провини","why":"Провина після відкладання не мотивує, а забирає енергію. Вона робить наступну справу ще болючішою, і цикл замикається.","act":"Після зриву скажи собі: «Було важко, починаю знову». Не карай себе: це швидше виводить із циклу."},"en":{"n":"The guilt cycle","why":"Guilt after delaying doesn't motivate, it drains energy. It makes the next task even more painful and the cycle closes.","act":"After a slip say to yourself: “It was hard, I'm starting again.” Don't punish yourself: that gets you out of the cycle faster."},"items":[{"ua":"Після того як я відклав(-ла) справу, мене гризе провина.","en":"After putting something off I'm gnawed by guilt.","r":0},{"ua":"Я нервуюсь про невиконану справу, але все одно її не роблю.","en":"I worry about the unfinished task but still don't do it.","r":0},{"ua":"Я кажу собі, що я лінивий(-а) чи недисциплінований(-а).","en":"I tell myself I'm lazy or undisciplined.","r":0},{"ua":"Я працюю найкраще в паніці перед самим дедлайном і маю з цього дивну гордість.","en":"I work best in a panic right before the deadline and take odd pride in it.","r":0},{"ua":"Коли я щось відклав(-ла), я спокійно повертаюсь до справи без самокатування.","en":"When I put something off I calmly return to it without beating myself up.","r":1}]}],"who":{"ua":["Прокрастинація не діагноз і не слабкий характер. Це звичка керувати емоціями через відкладання, і її можна змінювати малими кроками.","Варто звернутись до психолога чи лікаря, якщо відкладання супроводжується тривогою, депресивним настроєм, проблемами зі сном чи труднощами з концентрацією, або сильно впливає на роботу й стосунки. Це не діагноз, а орієнтир."],"en":["Procrastination isn't a diagnosis or a weak character. It's a habit of managing emotions by delaying, and it can be changed with small steps.","See a psychologist or doctor if delaying comes with anxiety, low mood, sleep problems or trouble concentrating, or strongly affects work and relationships. This isn't a diagnosis, just a compass."]},"guide":{"ua":{"t":"Зроблю завтра: як починати, не чекаючи натхнення","d":"Готовий PDF-гайд по прокрастинації: чому ти відкладаєш насправді, як зменшити опір і як будувати систему, що працює без сили волі. Без води й мотиваційних цитат. Приходить на email одразу після оплати.","days":["Чому ми відкладаємо: емоції, а не час","Шість причин і як їх розпізнати в собі","Старт: правило 5 хвилин, найменший крок, чернетки","Середовище й увага: як прибрати тертя","Цикл провини та коли звернутись по допомогу"],"bonus":["чекліст «Мій тригер відкладання»","тижневий план «Малі кроки»"]},"en":{"t":"I'll Do It Tomorrow: How to Start Without Waiting for Inspiration","d":"A ready-made PDF guide to procrastination: why you really delay, how to reduce resistance and how to build a system that works without willpower. No filler or motivational quotes. It lands in your inbox right after payment.","days":["Why we delay: emotions, not time","Six causes and how to spot them in yourself","Starting: the 5-minute rule, smallest step, drafts","Environment and attention: removing friction","The guilt cycle and when to seek help"],"bonus":["“My delay trigger” checklist","“Small steps” weekly plan"]},"price":{"ua":["€10","€10"],"en":["€10","€10"]}},"ui":{"ua":{"profile":"Твій профіль відкладання за 6 причинами","profileNote":"Відсоток середній. Профіль показує, що саме найсильніше змушує тебе відкладати.","drivers":"Що змушує відкладати найбільше","noDrv":"Жодна причина не виділяється високо. Це гарний знак.","match":"Рівень відкладання","toLow":"роблю одразу","toHigh":"король «потім»"},"en":{"profile":"Your procrastination profile across 6 causes","profileNote":"The percentage is an average. The profile shows what pushes you to delay the most.","drivers":"What pushes you to delay most","noDrv":"No cause stands out as high. That's a good sign.","match":"Delaying level","toLow":"do it now","toHigh":"king of later"}},"bands":[{"max":39,"id":"low","ua":{"h":"Мало відкладаєш","p":["Ти здебільшого береш і робиш. Відкладання трапляється, але не керує тобою. Це хороша основа: ти знаєш, як починати, і не боїшся неідеального старту.","Головне тут: не підміняти відпочинок роботою, а роботу відпочинком. Тримай баланс."],"tr":["Запиши, що допомагає тобі починати, і використовуй це у складних справах.","Не поспішай із жорсткими графіками: гнучкість теж ресурс.","Поділись прийомами з тим, кому важче."],"bullets":[]},"en":{"h":"You Rarely Delay","p":["You mostly just do things. Delaying happens but doesn't run you. That's a good base: you know how to start and aren't afraid of an imperfect start.","The key here: don't swap rest for work or work for rest. Keep the balance."],"tr":["Write down what helps you start and use it on harder tasks.","Don't rush into rigid schedules: flexibility is a resource too.","Share your methods with someone who finds it harder."],"bullets":[]}},{"max":64,"id":"mid","ua":{"h":"Іноді завтра","p":["Ти відкладаєш досить часто: інколи це допомагає перезавантажитись, інколи з'їдає нерви. Видно, що за відкладанням стоять конкретні тригери: страх, нудьга чи відволікання.","Це добра новина: коли знаєш тригер, його можна обійти. Тобі не потрібна залізна сила волі, а потрібні невеликі кроки й менше тертя."],"tr":["Обери одну справу, яку відкладаєш, і зроби найменший крок за 5 хвилин.","Прибери один головний відволікач із робочого місця.","Постав дедлайн на раніше, ніж справжній, і скажи про нього людині."],"bullets":[]},"en":{"h":"Sometimes Tomorrow","p":["You delay fairly often: sometimes it helps you reset, sometimes it eats your nerves. Specific triggers clearly sit behind it: fear, boredom or distraction.","That's good news: once you know the trigger you can work around it. You don't need iron willpower, you need small steps and less friction."],"tr":["Pick one task you're delaying and do the smallest step within 5 minutes.","Remove one main distraction from your workspace.","Set a deadline earlier than the real one and tell someone about it."],"bullets":[]}},{"max":100,"id":"high","ua":{"h":"Король «потім»","p":["Відкладання у тебе сильне й системне: страх, відволікання, провина й «все або нічого» крутяться по колу. Це дуже втомлює, і це не лінь. Це спосіб захиститись від неприємних відчуттів.","Така картина добре піддається змінам, якщо діяти малими кроками і без самообвинувачення. Якщо ж воно супроводжується тривогою, апатією чи труднощами з концентрацією, варто обговорити це зі спеціалістом."],"tr":["Сьогодні зроби одну справу за правилом 5 хвилин. Зупинитись можна після.","Заміни самокритику на «Було важко, починаю знову».","Розглянь консультацію психолога, особливо якщо це триває місяцями й заважає життю."],"bullets":[]},"en":{"h":"The King of Later","p":["Your delaying is strong and systemic: fear, distraction, guilt and “all or nothing” go around in a circle. It's very tiring, and it's not laziness. It's a way to protect yourself from unpleasant feelings.","This pattern responds well to change if you act in small steps and without self-blame. If it comes with anxiety, apathy or trouble concentrating, it's worth discussing with a specialist."],"tr":["Today do one task using the 5-minute rule. You may stop after.","Replace self-criticism with “It was hard, I'm starting again.”","Consider a psychologist, especially if this has lasted for months and gets in the way of life."],"bullets":[]}}]},{"id":"critic","kind":"type","min":5,"scale":{"ua":["Зовсім не про мене","Скоріше ні","Буває по-різному","Скоріше так","Це 100% я"],"en":["Not me at all","Not really","Sometimes","Pretty much","This is 100% me"]},"DIMS":[{"ua":{"n":"Суддя","why":"Суддя виносить вироки: «ти невдаха», «ти все зіпсував». Він говорить категорично й про всю тебе, а не про конкретну помилку.","act":"Коли чуєш вирок, перетвори його на факт: замість «я невдаха» скажи «цього разу не вийшло».","res":{"h":"Твій головний критик: Суддя","p":["Твій критик це Суддя: він виносить вироки про тебе цілком, а не про конкретну дію. «Я зіпсував» швидко перетворюється на «я поганий».","Суддя здається об'єктивним, але він необ'єктивний: він ніколи не бачить контексту, зусиль чи прогресу. Його можна навчити говорити фактами."],"tr":["Записуй вирок слово в слово й перепиши його як факт про дію.","Запитай: «Що я сказав(-ла) б другові на моєму місці?»","Раз на день записуй одну річ, яка вдалась."],"bullets":[]}},"en":{"n":"The Judge","why":"The Judge hands down verdicts: “you're a failure,” “you ruined everything.” He speaks categorically and about all of you, not about one mistake.","act":"When you hear a verdict, turn it into a fact: instead of “I'm a failure” say “this time it didn't work.”","res":{"h":"Your main critic: The Judge","p":["Your critic is the Judge: he rules on you as a whole, not on a specific action. “I messed up” quickly turns into “I'm bad.”","The Judge seems objective but he isn't: he never sees context, effort or progress. He can be taught to speak in facts."],"tr":["Write the verdict word for word and rewrite it as a fact about an action.","Ask: “What would I say to a friend in my place?”","Once a day note one thing that went well."],"bullets":[]}},"items":[{"ua":"Після помилки я думаю про себе: «я невдаха» чи «я ні на що не годен(-на)».","en":"After a mistake I thin
